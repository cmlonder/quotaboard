    $("anatomy").innerHTML = `<div class="small muted" style="margin-bottom:5px">${esc(t("tokens"))} · <span class="mono">${tok(ts_)}</span></div>${bar(tt.tokens, ts_)}
      <div class="small muted" style="margin:14px 0 5px">${esc(t("cost"))} · <span class="mono">${usd(cs)}</span></div>${bar(tt.usd, cs)}
      ${legendHtml(names.map((n, i) => ({n: t(n), c: cols[i], v: `${pc(tt.tokens[i] / ts_ * 100)} / ${pc(tt.usd[i] / cs * 100)}`})))}
      <p class="insight">${t("anatomy_insight", {rt: pc(tt.tokens[3] / ts_ * 100), rc: pc(tt.usd[3] / cs * 100), ot: pc(tt.tokens[1] / ts_ * 100), oc: pc(tt.usd[1] / cs * 100)})}</p>`;
  }

  // windows against the cap
  columns("windows", v.recent_windows.map(b => ({total: b.usd, b, parts: [{v: b.usd, c: b.active ? "--pen-blue" : "--ink-3"}]})),
    {cap: v.window?.cap, label: it => hm(it.b.start), title: it => tipRows(`${dayHm(it.b.start)} – ${hm(it.b.end || it.b.close)}`, [["Claude", usd(it.total)]])});

  // projects, agents, issues
  const group = (key, filt = () => true) => Object.values(ss.filter(filt).reduce((acc, r) => { const k = r[key] || "–"; const g = acc[k] ||= {n: k, v: 0, count: 0, kind: r.kind, title: r.issue_title, agents: new Set()}; g.v += r[f]; g.count++; g.agents.add(r.agent); return acc; }, {})).sort((a, b) => b.v - a.v);
  const pr = group("project");
  $("projects_aside").textContent = t("total_f", {v: usd(pr.reduce((a, i) => a + i.v, 0))});
  ranks("projects", pr, {sub: i => i.count ? t("sessions_n", {n: i.count}) : "", limit: 9});
  const ag = group("agent", r => r.kind === "multica");
  $("agents_aside").textContent = usd(ag.reduce((a, i) => a + i.v, 0));
  ranks("agents_spend", ag, {color: () => KVAR("multica"), sub: i => i.count ? t("sessions_n", {n: i.count}) : "", limit: 9});
  const is = group("issue", r => r.kind === "multica" && r.issue);
  $("issues_aside").textContent = usd(is.reduce((a, i) => a + i.v, 0));
  ranks("issues", is.map(i => ({...i, n: `${i.n} ${i.title || ""}`})), {color: () => KVAR("multica"), sub: i => i.agents ? [...i.agents].join(", ") : "", limit: 9});
}

// ---------- tables ----------
function table(id, cols, rows, def, limit = 80) {
  const s = F.sort[id] || def, col = cols.find(k => k.k === s.k) || cols[0];
  const sorted = [...rows].sort((a, b) => { const x = col.v ? col.v(a) : a[col.k], y = col.v ? col.v(b) : b[col.k]; return (x > y ? 1 : x < y ? -1 : 0) * (s.dir || -1); });
  $(id).innerHTML = rows.length ? `<table><thead><tr>${cols.map(k => `<th class="${k.r ? "r" : ""}" ${k.k ? `data-s="${k.k}"` : ""} ${s.k === k.k ? `aria-sort="${s.dir === 1 ? "ascending" : "descending"}"` : ""}>${k.k ? `<button class="th-btn" type="button">${esc(k.t)}${s.k === k.k ? (s.dir === 1 ? " ↑" : " ↓") : ""}</button>` : esc(k.t)}</th>`).join("")}</tr></thead>
    <tbody>${sorted.slice(0, limit).map(r => `<tr>${cols.map(k => `<td class="${k.r ? "r" : ""}">${k.h(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    ${rows.length > limit ? `<div class="table-foot">${esc(t("showing", {a: limit, b: rows.length}))}</div>` : ""}`
    : `<div class="empty">${esc(t("nothing_match"))}</div>`;
  $(id).querySelectorAll("th[data-s] button").forEach(th => th.onclick = () => { const k = th.parentElement.dataset.s; F.sort[id] = {k, dir: s.k === k ? -(s.dir || -1) : -1}; save(); draw(); $(id).querySelector(`th[data-s="${k}"] button`)?.focus(); });
}
function renderSessions(v) {
  const f = F.span, rows = sessions(v), max = Math.max(1e-9, ...rows.map(r => r[f]));
  table("sessions", [
    {t: t("s_session"), k: "title", v: nameOf, h: r => `<div class="cell-title" title="${esc(r.first_message)}">${esc(nameOf(r))}</div><div class="cell-sub">${esc(r.project)} · <span class="mono">${esc(r.id.slice(0, 8))}</span>${r.model ? " · " + esc(MNAME(r.model)) : ""}</div>`},
    {t: t("s_kind"), k: "kind", h: r => `<span class="tag"><i class="sw" style="background:var(${KVAR(r.kind)})"></i>${esc(t("k_" + r.kind))}</span>`},
    {t: t("span_" + f), k: f, r: 1, h: r => `${usd(r[f])}<div class="inline-bar"><span style="width:${r[f] / max * 100}%"></span></div>`},
    ...(f === "week" ? [] : [{t: t("s_week"), k: "week", r: 1, h: r => usd(r.week)}]),
    {t: t("s_context"), k: "context", r: 1, h: r => `<span style="${r.context > 400000 ? "color:var(--pen-red)" : ""}">${tok(r.context)}</span>`},
    {t: t("s_last"), k: "last", r: 1, h: r => `<span class="muted">${esc(when(r.last))}</span>`},
  ], rows, {k: f});
}
const LIVE = new Set(["queued", "dispatched", "running"]);
const ST = s => ({completed: t("r_done"), failed: t("r_failed"), cancelled: t("r_cancelled"), queued: t("r_queued"), dispatched: t("r_starting"), running: t("r_running")})[s] || s;
function renderRuns(v) {
  const runs = v.runs.filter(r => match([r.agent, r.issue_key, r.issue_title, r.model, r.reason].join(" ")));
  const c = s => runs.filter(r => s === "live" ? LIVE.has(r.status) : r.status === s).length;
  $("run_counts").innerHTML = [[runs.length, t("r_total")], [c("completed"), t("r_done")], [c("failed"), t("r_failed")], [c("live"), t("r_running")], [c("cancelled"), t("r_cancelled")]]
    .map(([n, l], i) => `<div><div class="v" style="${i === 2 && n ? "color:var(--pen-red)" : ""}">${n}</div><div class="l">${esc(l)}</div></div>`).join("");
  const byAgent = Object.values(runs.reduce((acc, r) => { const a = acc[r.agent] ||= {n: r.agent, v: 0, done: 0, failed: 0, other: 0}; a.v++; r.status === "completed" ? a.done++ : r.status === "failed" ? a.failed++ : a.other++; return acc; }, {})).sort((a, b) => b.v - a.v);
  ranks("runs_by_agent", byAgent.map(a => ({...a, parts: [{v: a.done, c: "--ink-2", n: t("r_done")}, {v: a.failed, c: "--pen-red", n: t("r_failed")}, {v: a.other, c: "--rule-2", n: "…"}]})),
    {fmt: x => String(x), sub: a => a.failed ? `${a.failed} ${t("r_failed")}` : "", limit: 10});
  $("runs_by_agent").insertAdjacentHTML("beforeend", legendHtml([{n: t("r_done"), c: "--ink-2"}, {n: t("r_failed"), c: "--pen-red"}, {n: `${t("r_cancelled")} / ${t("r_running")}`, c: "--rule-2"}]));
  const reasons = Object.values(runs.filter(r => r.status === "failed").reduce((acc, r) => { const k = (r.reason || "?").split(".").pop(); const a = acc[k] ||= {n: k.replace(/_/g, " "), v: 0, agents: new Set()}; a.v++; a.agents.add(r.agent); return acc; }, {})).sort((a, b) => b.v - a.v);
  $("fail_aside").textContent = `${c("failed")} ${t("r_failed")}`;
  ranks("fail_reasons", reasons, {color: () => "--pen-red", fmt: x => String(x), sub: a => a.agents ? [...a.agents].slice(0, 3).join(", ") + (a.agents.size > 3 ? "…" : "") : "", limit: 8});

  const ags = [...new Set(v.runs.map(r => r.agent))].sort();
  $("ragent").innerHTML = `<option value="">${esc(t("all_agents"))}</option>` + ags.map(a => `<option ${a === F.ragent ? "selected" : ""}>${esc(a)}</option>`).join("");
  $("ragent").onchange = e => { F.ragent = e.target.value; save(); draw(); };
  $("rstatus").innerHTML = [["", t("r_all")], ["live", t("r_live")], ["failed", t("r_failed_f")], ["completed", t("r_done_f")]].map(([k, l]) => `<button data-v="${k}" aria-pressed="${k === F.rstatus}">${esc(l)}</button>`).join("");
  $("rstatus").querySelectorAll("button").forEach(b => b.onclick = () => { F.rstatus = b.dataset.v; save(); draw(); });
  const rows = runs.filter(r => (!F.ragent || r.agent === F.ragent) && (!F.rstatus || (F.rstatus === "live" ? LIVE.has(r.status) : r.status === F.rstatus)))
