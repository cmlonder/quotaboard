<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>quotaboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
/* quotaboard — an instrument, not a report. One question first: what runs out, and when does it refill.
   Geist for words, Geist Mono for the numbers that move; quiet surfaces, colour only where it carries meaning. */
:root {
  --paper: #f5f6f8; --paper-2: #eceef2; --sheet: #ffffff; --raise: #ffffff;
  --ink: #0d1016; --ink-2: #454c59; --ink-3: #6e7684; --rule: rgba(14, 20, 32, .075); --rule-2: rgba(14, 20, 32, .14);
  --pen-red: #d0392c; --pen-blue: #3d5afe; --amber: #b86e00; --green: #0f9a4e;
  --wash-red: rgba(208, 57, 44, .08); --wash-blue: rgba(61, 90, 254, .08); --wash-amber: rgba(184, 110, 0, .1); --band: rgba(14, 20, 32, .035);
  --track: #e8eaef; --fill: #1d222c;
  --k-multica: #3d6ef0; --k-long: #e0622f; --k-interactive: #179f6f; --k-scheduled: #a87600; --k-side: #d9649a;
  --m-sonnet: #3d6ef0; --m-opus: #6a55e0; --m-fable: #d9443f; --m-haiku: #179f6f; --m-other: #767a83;
  --t-input: #3d6ef0; --t-output: #e0622f; --t-write: #179f6f; --t-read: #a87600;
  --heat-0: #eef1f6; --heat-1: #d3dcf6; --heat-2: #a6b8f0; --heat-3: #6f8ce8; --heat-4: #3d5afe; --heat-5: #2337b8;
  --shadow: 0 1px 0 rgba(14, 20, 32, .04), 0 1px 3px rgba(14, 20, 32, .05), 0 12px 32px -18px rgba(14, 20, 32, .22);
  --ring: 0 0 0 1px var(--rule);
  --c-claude: #d0683c; --c-codex: #3a404b; --c-antigravity: #3d6ef0; --c-openrouter: #7c5ce0;
  --dry: rgba(208, 57, 44, .14);
  --sans: "Geist", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --num: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --mono: var(--num);
  --r: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #08090c; --paper-2: #13161c; --sheet: #0f1116; --raise: #151820;
    --ink: #eef0f4; --ink-2: #b3b9c4; --ink-3: #7d8593; --rule: rgba(255, 255, 255, .07); --rule-2: rgba(255, 255, 255, .13);
    --pen-red: #ff6b5c; --pen-blue: #8c9dff; --amber: #f2b046; --green: #3fd58a;
    --wash-red: rgba(255, 107, 92, .12); --wash-blue: rgba(140, 157, 255, .12); --wash-amber: rgba(242, 176, 70, .12); --band: rgba(255, 255, 255, .035);
    --track: #1b1f27; --fill: #e3e6ec;
    --k-multica: #5b8cff; --k-long: #f07a45; --k-interactive: #2bc48a; --k-scheduled: #d9a12a; --k-side: #e3709f;
    --m-sonnet: #5b8cff; --m-opus: #9d8cff; --m-fable: #ff7a72; --m-haiku: #2bc48a; --m-other: #8a8f99;
    --t-input: #5b8cff; --t-output: #f07a45; --t-write: #2bc48a; --t-read: #d9a12a;
    --heat-0: #14171d; --heat-1: #1b2443; --heat-2: #24357a; --heat-3: #3550c4; --heat-4: #6a80ff; --heat-5: #b3bfff;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 16px 40px -20px rgba(0, 0, 0, .8);
    --c-claude: #f0895e; --c-codex: #c9ced8; --c-antigravity: #7ea1ff; --c-openrouter: #ae93ff;
    --dry: rgba(255, 107, 92, .16);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #08090c; --paper-2: #13161c; --sheet: #0f1116; --raise: #151820;
  --ink: #eef0f4; --ink-2: #b3b9c4; --ink-3: #7d8593; --rule: rgba(255, 255, 255, .07); --rule-2: rgba(255, 255, 255, .13);
  --pen-red: #ff6b5c; --pen-blue: #8c9dff; --amber: #f2b046; --green: #3fd58a;
  --wash-red: rgba(255, 107, 92, .12); --wash-blue: rgba(140, 157, 255, .12); --wash-amber: rgba(242, 176, 70, .12); --band: rgba(255, 255, 255, .035);
  --track: #1b1f27; --fill: #e3e6ec;
  --k-multica: #5b8cff; --k-long: #f07a45; --k-interactive: #2bc48a; --k-scheduled: #d9a12a; --k-side: #e3709f;
  --m-sonnet: #5b8cff; --m-opus: #9d8cff; --m-fable: #ff7a72; --m-haiku: #2bc48a; --m-other: #8a8f99;
  --t-input: #5b8cff; --t-output: #f07a45; --t-write: #2bc48a; --t-read: #d9a12a;
  --heat-0: #14171d; --heat-1: #1b2443; --heat-2: #24357a; --heat-3: #3550c4; --heat-4: #6a80ff; --heat-5: #b3bfff;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 16px 40px -20px rgba(0, 0, 0, .8);
  --c-claude: #f0895e; --c-codex: #c9ced8; --c-antigravity: #7ea1ff; --c-openrouter: #ae93ff;
  --dry: rgba(255, 107, 92, .16);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); letter-spacing: -0.005em; font-feature-settings: "ss01"; -webkit-font-smoothing: antialiased; caret-color: var(--pen-blue); font-variant-numeric: tabular-nums; }
::selection { background: color-mix(in srgb, var(--pen-blue) 22%, transparent); color: var(--ink); }
:focus-visible { outline: 2px solid var(--pen-blue); outline-offset: 2px; border-radius: 4px; }
* { scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
a { color: var(--pen-blue); text-underline-offset: 3px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
button, select, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* icons: one 16px grid, 1.5 stroke, drawn here — never emoji */
.ic { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: -3px; }
.ic.sm { width: 13px; height: 13px; vertical-align: -2px; }
.spacer { flex: 1; }
.skip { position: absolute; left: 12px; top: -40px; z-index: 50; background: var(--ink); color: var(--paper); padding: 6px 12px; border-radius: 7px; text-decoration: none; }
.skip:focus { top: 10px; }
kbd { font: 500 11px/1 var(--sans); color: var(--ink-3); border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--sheet); }

/* shell: a quiet rail on the left, the work on the right */
.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 18px 12px 16px; border-right: 1px solid var(--rule); background: var(--paper); }
.mark { margin: 0 0 6px; padding: 0 10px; display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -0.01em; font-size: 14.5px; }
.mark svg { display: block; }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav a { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 520; font-size: 13.5px; transition: background .15s, color .15s; }
.nav a:hover { background: var(--band); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--sheet); color: var(--ink); box-shadow: var(--ring), 0 1px 2px rgba(0,0,0,.06); }
.nav a[aria-current="page"] .ic { color: var(--pen-blue); }
.nav .nl { flex: 1; min-width: 0; }
.nav kbd { opacity: 0; transition: opacity .15s; }
.nav a:hover kbd, .nav a:focus-visible kbd { opacity: 1; }
.nb:empty { display: none; }
.nb { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 650; background: var(--paper-2); color: var(--ink-2); }
.nb.red { background: #c3352b; color: #fff; }
.nb.amber { background: var(--wash-amber); color: var(--amber); }
.nb + kbd { display: none; }
.rail-foot { margin-top: auto; padding: 0 10px; display: grid; gap: 6px; }
.health { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 7px; text-decoration: none; border-radius: 6px; padding: 4px 0; }
.health:hover { color: var(--ink); }
.health.bad { color: var(--pen-red); }
.health .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 18%, transparent); }
.health.wait .dot { background: var(--ink-3); box-shadow: none; }
.health.bad .dot { background: var(--pen-red); box-shadow: 0 0 0 3px var(--wash-red); }

/* top strip of the work column */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.scrolled { border-bottom-color: var(--rule); }
.top-in { max-width: 1080px; margin: 0 auto; padding: 12px 32px; display: flex; align-items: center; gap: 10px; }
.mark-sm { display: none; }
.view-title { font-size: 15px; font-weight: 620; color: var(--ink); letter-spacing: -0.01em; }
.stamp { font-size: 12.5px; color: var(--ink-3); margin-right: 4px; }
#reload.spin .ic { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner { max-width: 1080px; margin: 12px auto 0; padding: 0 32px; }
.banner > div { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--wash-red); color: var(--ink); font-size: 13px; }
.banner .ic { color: var(--pen-red); }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 7px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: none; padding: 4px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; transition: background .15s, color .15s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.icon-btn { border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink-2); border-radius: 7px; width: 30px; height: 28px; cursor: pointer; display: inline-grid; place-items: center; padding: 0; transition: border-color .15s, color .15s; }
.icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn.sm { width: 26px; height: 26px; border-radius: 6px; }

main { max-width: 1080px; margin: 0 auto; padding: 20px 32px 96px; }
main:focus, main:focus-visible { outline: none; }
.notes li.state { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 2px 10px; border: 0; padding: 4px 0; }
.notes li.state p { grid-column: 2; }
.sources .badge.ok { background: none; color: var(--ink-3); padding: 0; }
.sources .badge.ok .ic { color: var(--green); }
.view { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { opacity: .4; transform: translateY(4px); } }
.view-lead { font-size: 18px; line-height: 1.35; font-weight: 540; letter-spacing: -0.01em; margin: 4px 0 18px; max-width: 60ch; text-wrap: balance; }

/* status badges: a word, a drawn shape and a hue together — never colour alone */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; font-size: 12px; font-weight: 560; white-space: nowrap; background: var(--paper-2); color: var(--ink-2); }
.badge .ic { width: 14px; height: 14px; vertical-align: 0; }
.badge.ok { background: color-mix(in srgb, var(--green) 11%, transparent); color: var(--green); }
.badge.low { background: var(--wash-amber); color: var(--amber); }
.badge.empty { background: var(--wash-red); color: var(--pen-red); }
.badge.off { background: transparent; box-shadow: inset 0 0 0 1px var(--rule-2); color: var(--ink-3); }
.badge.fb { background: var(--wash-blue); color: var(--pen-blue); }
.badge.quiet { background: none; padding: 0; height: auto; }

/* provider tiles */
.ptile { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; color: var(--ph); background: color-mix(in srgb, var(--ph) 12%, var(--sheet)); }
.ptile .ic { width: 17px; height: 17px; vertical-align: 0; }
.ptile.sm { width: 22px; height: 22px; border-radius: 6px; }
.ptile.sm .ic { width: 13px; height: 13px; }
.p-claude { --ph: var(--c-claude); } .p-codex { --ph: var(--c-codex); } .p-antigravity { --ph: var(--c-antigravity); } .p-openrouter { --ph: var(--c-openrouter); } .p-other { --ph: var(--ink-3); }
.go { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; color: var(--pen-blue); text-decoration: none; border-radius: 5px; padding: 2px 2px 2px 6px; }
.go:hover { text-decoration: underline; text-underline-offset: 3px; }

/* empty and error states */
.state { display: grid; justify-items: start; gap: 6px; padding: 18px 0; color: var(--ink-2); font-size: 13.5px; max-width: 54ch; }
.state .ic { width: 20px; height: 20px; color: var(--ink-3); }
.state.ok .ic { color: var(--green); }
.state.bad .ic { color: var(--pen-red); }
.state b { color: var(--ink); font-weight: 600; }
.state p { margin: 0; color: var(--ink-3); font-size: 12.5px; }
h2 { font-size: 13px; font-weight: 600; letter-spacing: 0; margin: 0; color: var(--ink-2); }
h3 { font-size: 14px; font-weight: 600; margin: 0 0 10px; color: var(--ink); }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 10px; }
.section-head .note { font-size: 12.5px; color: var(--ink-3); }

/* ---------- first screen ---------- */
.now { padding: 8px 0 26px; }
.lead { font-size: 27px; line-height: 1.25; font-weight: 560; letter-spacing: -0.02em; margin: 0; max-width: 36ch; text-wrap: balance; }
.lead .warn { color: var(--pen-red); }
.lead-sub { margin: 10px 0 0; font-size: 15px; color: var(--ink-2); max-width: 70ch; text-wrap: pretty; }
.lead-sub b { color: var(--ink); font-weight: 600; }
.attention { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.attention:empty { display: none; }
.attention li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; padding: 10px 12px; border-radius: 9px; background: var(--wash-red); }
.attention li.medium { background: var(--wash-amber); }
.attention .lv { margin-top: 3px; }
.attention .t { font-weight: 550; }
.attention .w { grid-column: 2; font-size: 12.5px; color: var(--ink-2); }
.attention .act { grid-column: 3; grid-row: 1 / span 2; align-self: center; }

.card { background: var(--sheet); border-radius: var(--r); box-shadow: var(--ring), var(--shadow); }
.quotas { padding: 6px 0; }
.quotas .section-head { padding: 12px 20px 0; margin: 0; }
.qlist { list-style: none; margin: 0; padding: 0; }
.q { display: grid; grid-template-columns: 32px minmax(140px, 1.1fr) minmax(120px, 1.8fr) 9.5ch minmax(200px, 1.25fr); gap: 2px 16px; align-items: center; padding: 13px 20px; }
.q.skel-row .skel { height: 10px; }
.q .skel.tile { width: 32px; height: 32px; border-radius: 9px; }
.q + .q { border-top: 1px solid var(--rule); }
.q-name { min-width: 0; }
.q-name b { display: block; font-weight: 600; font-size: 14.5px; letter-spacing: -0.005em; }
.q-name span { display: block; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--fill); transform-origin: left; }
.bar.low i { background: var(--amber); }
.bar.empty i { background: var(--pen-red); }
.bar.off { background: transparent; box-shadow: inset 0 0 0 1px var(--rule-2); }
.bar.est i { opacity: .55; }
.bar { overflow: visible; }
.bar i { transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.bar .tm { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink-3); box-shadow: 0 0 0 1.5px var(--sheet); }
.bar.behind .tm { background: var(--pen-red); }
.q-val { display: grid; justify-items: end; gap: 3px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; line-height: 1.15; }
.q-val .badge { font-size: 11.5px; height: 20px; }
.q-when { font-size: 13px; color: var(--ink-2); min-width: 0; display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 6px; }
.q-when > .ic { color: var(--ink-3); margin-top: 2px; }
.q-when > span, .q-when > div { grid-column: 2; }
.q-when span { display: block; font-size: 12.5px; color: var(--ink-3); }
.quotas .section-head .seg { margin-left: auto; }
.seg button { display: inline-flex; align-items: center; gap: 5px; }
.qtimeline { padding: 4px 0 0; }
.rec-note { margin: 0; padding: 0 20px 10px; font-size: 12.5px; color: var(--ink-3); }
.qtimeline .sheet { box-shadow: none; border-radius: 0; border-top: 1px solid var(--rule); }
.q-when .warn { color: var(--pen-red); font-weight: 550; }
.q-more { grid-column: 1 / -1; margin-top: 4px; }
.q-more summary { list-style: none; cursor: pointer; font-size: 12.5px; color: var(--pen-blue); display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; }
.q-more summary::-webkit-details-marker { display: none; }
.q-more summary svg { transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.q-more[open] summary svg { transform: rotate(90deg); }
.sub-q { display: grid; grid-template-columns: minmax(140px, 1.1fr) minmax(120px, 1.8fr) 9.5ch minmax(200px, 1.25fr); gap: 2px 16px; align-items: center; padding: 7px 0; font-size: 13px; }
.q-more .kids { margin-left: 48px; }
.sub-q:first-of-type { margin-top: 6px; }
.sub-q .bar { height: 5px; }
.sub-q .q-val { font-size: 13.5px; font-weight: 550; }
.sub-q .q-when { font-size: 12.5px; color: var(--ink-3); }
.tm-key { flex-basis: 100%; max-width: 80ch; }
.q-foot { padding: 6px 20px 14px; align-items: center; font-size: 12.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }

.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
.pane { padding: 16px 20px 18px; }
.pane .section-head { margin-bottom: 8px; }
.bench-state { font-size: 15px; font-weight: 560; margin: 0 0 4px; letter-spacing: -0.005em; }
.bench-list { list-style: none; margin: 8px 0 0; padding: 0; }
.bench-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule); }
.bench-list .who b { font-weight: 600; }
.bench-list .who span:not(.arrow) { display: block; font-size: 12.5px; color: var(--ink-3); }
.bench-list .arrow { color: var(--ink-3); margin: 0 4px; }
.lines { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; color: var(--ink-2); }
.lines li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
.lines li svg { flex: none; transform: translateY(1px); }
.pane-foot { margin-top: 12px; }
.spend { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 0 16px; }
.spend dt, .spend dd { margin: 0; padding: 9px 0; border-top: 1px solid var(--rule); }
.spend dt:first-of-type, .spend dd:first-of-type { border-top: 0; padding-top: 2px; }
.spend dt { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; text-align: right; }
.spend dd { font-size: 13px; color: var(--ink-2); line-height: 1.35; align-self: center; }
.spend dd span { display: block; font-size: 12.5px; color: var(--ink-3); }
.src { margin: 10px 0 0; font-size: 12px; color: var(--ink-3); }


/* buttons */
.btn { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 7px; padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(.5px); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.danger { color: var(--pen-red); border-color: color-mix(in srgb, var(--pen-red) 50%, transparent); }
.btn.danger:hover { background: var(--wash-red); }

.link { border: 0; background: none; padding: 0; color: var(--pen-blue); cursor: pointer; font-size: 13px; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--pen-blue) 40%, transparent); text-underline-offset: 3px; }

/* ---------- inner views ---------- */

.notes-sec { margin-top: 30px; }

/* ---------- home ---------- */
.home { display: grid; gap: 18px; }

.hero-sub b { color: var(--ink); font-weight: 600; } .hero-sub b.bad { color: var(--pen-red); }
.tally { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; }
.tally li { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 9px; border-radius: 15px; font-size: 13px; color: var(--ink-2); background: var(--sheet); box-shadow: var(--ring); }

.next { display: grid; justify-items: end; text-align: right; gap: 2px; min-width: 210px; padding: 16px 20px; border-radius: var(--r); background: var(--sheet); box-shadow: var(--ring), var(--shadow); }

.nx-big small { font-size: 14px; color: var(--ink-3); font-family: var(--sans); margin-right: 6px; letter-spacing: 0; }
.next.bad .nx-big b { color: var(--pen-red); }
.nx-t { font-size: 13px; color: var(--ink-2); max-width: 26ch; }
.nx-at { font-size: 12px; color: var(--ink-3); }

.runway { padding: 18px 0 12px; overflow: hidden; }
.rw-head { display: flex; align-items: flex-start; gap: 16px; padding: 0 22px 10px; }
.rw-title { flex: 1; min-width: 0; }
.rw-title h2 { font-size: 15px; color: var(--ink); font-weight: 620; letter-spacing: -0.01em; }
.rw-note { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-3); }
.rw-lanes { list-style: none; margin: 0; padding: 0; }
.lane { position: relative; display: grid; grid-template-columns: minmax(200px, 250px) minmax(0, 1fr) 150px; gap: 0 18px; align-items: center; padding: 6px 22px; }
.lane + .lane { border-top: 1px solid var(--rule); }

.rw-axis { position: relative; height: 18px; }

.lane-info { display: flex; align-items: center; gap: 11px; min-width: 0; border: 0; background: none; padding: 6px 6px 6px 0; margin: 0; text-align: left; cursor: pointer; border-radius: 10px; color: inherit; font: inherit; }

.ln { display: grid; min-width: 0; line-height: 1.25; }
.ln b { font-weight: 600; font-size: 14px; transition: color .15s; }
.ln span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane .tag { margin-left: auto; flex: none; font-size: 11px; font-weight: 560; color: var(--ink-2); padding: 2px 7px; border-radius: 6px; background: var(--paper-2); }
.track { position: relative; height: 44px; border-radius: 8px; background: linear-gradient(90deg, var(--band), transparent var(--now)), transparent; }
.track::before { content: ""; position: absolute; top: -6px; bottom: -6px; left: var(--now); width: 1.5px; margin-left: -0.75px; background: var(--pen-blue); opacity: .55; z-index: 2; }

.mk { position: absolute; top: 50%; transform: translate(-50%, -50%); z-index: 4; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px 0 5px; border-radius: 10px; font: 500 11px/1 var(--num); letter-spacing: -0.02em; white-space: nowrap; background: var(--sheet); box-shadow: var(--ring), 0 2px 6px -2px rgba(0,0,0,.18); color: var(--ink-2); }

.lane.open { background: color-mix(in srgb, var(--ph) 4%, transparent); }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 24px; padding: 12px 14px; border-radius: 12px; background: var(--paper); }

.rw-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px 22px 2px; margin-top: 4px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-3); }

.lg-hist { background: linear-gradient(var(--ink-2), var(--ink-2)) 0 1px / 100% 1.75px no-repeat, color-mix(in srgb, var(--ink-2) 14%, transparent); }
.lg-proj { background: repeating-linear-gradient(90deg, var(--ink-2) 0 4px, transparent 4px 8px) 0 50% / 100% 1.5px no-repeat; }
.lg-dry { background: var(--dry); }

.skel-lane { grid-template-columns: 220px 1fr 120px; padding-top: 14px; padding-bottom: 14px; }

.rw-lanes.intro .mk { animation: pop .5s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i) * 45ms + 700ms); }
@keyframes draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

.bento { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 18px; align-items: stretch; }

.spark-k { display: block; font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.bento .spend dt { font-size: 15px; font-weight: 500; }

/* calendar: the first thing on the page */
.cal { padding: 16px 20px 18px; margin-bottom: 14px; }
.cal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cal-title { font-size: 15px; font-weight: 620; color: var(--ink); letter-spacing: -0.015em; margin: 0; }
.cal-nav { display: flex; gap: 4px; align-items: center; }

.glance { list-style: none; margin: 12px 0 14px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.glance li { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 8px; border-radius: 8px; background: var(--paper); font-size: 13px; color: var(--ink-2); }
.glance li .ic { color: var(--ink-3); }
.glance li.ok .ic { color: var(--green); } .glance li.low .ic { color: var(--amber); } .glance li.fb .ic { color: var(--pen-blue); }
.glance li.warn { background: var(--wash-red); color: var(--ink); } .glance li.warn .ic { color: var(--pen-red); }
.glance b { font-weight: 620; color: var(--ink); }
.glance li.warn b { color: var(--pen-red); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { font-size: 11.5px; color: var(--ink-3); padding: 0 7px 2px; font-weight: 560; text-transform: capitalize; }
.cal-cell { position: relative; text-align: left; border: 0; border-radius: 9px; padding: 7px 7px 8px; min-height: 118px; min-width: 0; background: color-mix(in srgb, var(--pen-blue) calc(var(--tone, 0) * 1%), var(--paper)); cursor: pointer; display: flex; flex-direction: column; gap: 5px; color: var(--ink); font: inherit; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .15s, background .2s; }
.cal.month .cal-cell { min-height: 78px; }
.cal-cell:hover { box-shadow: inset 0 0 0 1px var(--rule-2); }
.cal-cell[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.cal-cell.out { opacity: .42; }
.cal-cell .d { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 620; color: var(--ink-2); min-width: 0; }
.cal-cell.past .d .n { color: var(--ink-3); }
.cal-cell.today .d .n { background: var(--pen-blue); color: #fff; border-radius: 10px; padding: 1px 7px; }
:root[data-theme="dark"] .cal-cell.today .d .n { color: #0e1013; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cal-cell.today .d .n { color: #0e1013; } }
.cal-cell .sp { font-size: 11px; font-weight: 500; color: var(--ink-3); }
.cal-cell .or { margin-left: auto; color: var(--ph); opacity: .75; display: inline-grid; }
.cal-cell .or .ic { width: 12px; height: 12px; }
.evs { display: grid; gap: 3px; min-width: 0; }
.ev { display: flex; align-items: center; gap: 4px; font-size: 11.5px; line-height: 1.3; color: var(--ink-2); white-space: nowrap; overflow: hidden; min-width: 0; padding: 1px 5px 1px 3px; border-radius: 5px; background: color-mix(in srgb, var(--ph) 10%, transparent); }
.ev .ic { width: 12px; height: 12px; color: var(--ph); vertical-align: 0; }
.ev b { font-weight: 620; color: var(--ink); }
.ev .tx { overflow: hidden; text-overflow: ellipsis; }
.ev.big { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ph) 45%, transparent); }
.ev.warn { background: var(--wash-red); } .ev.warn b, .ev.warn .tx, .ev.warn .ic { color: color-mix(in srgb, var(--pen-red) 82%, var(--ink)); }
.cal.month .ev .tx { display: none; }
.more-ev { font-size: 11px; color: var(--ink-3); padding-left: 3px; }
.p-fb { --ph: var(--pen-blue); }
.cal-day { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
.cal-day-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.cal-day-head h3 { margin: 0; }
.cal-day .aside { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.cal-day ul { list-style: none; margin: 0; padding: 0; }
.cal-day li { display: grid; grid-template-columns: 46px 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 13px; }
.cal-day li:first-child { border-top: 0; }
.cal-day li.done { color: var(--ink-3); }
.cal-day li.warn span:not(.aside):not(.badge) { color: var(--pen-red); font-weight: 550; }
.cal-day time { color: var(--ink-3); font-size: 12.5px; }
.cal-past { margin-top: 8px; font-size: 12.5px; }
.cal-hint { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; color: var(--ink-3); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.tone-sw { width: 26px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--paper), color-mix(in srgb, var(--pen-blue) 25%, var(--paper))); box-shadow: inset 0 0 0 1px var(--rule); }
.fields label.wide input { width: 210px; }
.notes-sec .section-head { margin-bottom: 12px; }
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.set h3 { margin-bottom: 12px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); font-size: 13.5px; }
.set-help { font-size: 12.5px; color: var(--ink-3); margin: 0 0 12px; }
.fields { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; margin-bottom: 12px; }
.fields label { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.fields input { width: 110px; border: 1px solid var(--rule-2); border-radius: 7px; padding: 6px 8px; background: var(--sheet); }
.fields input:focus { border-color: var(--pen-blue); }
#claude_set.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pen-blue) 35%, transparent), var(--shadow); } }
.sources { list-style: none; margin: 0; padding: 0; }
.sources li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); font-size: 13px; }
.sources li span.e { grid-column: 1 / -1; font-size: 12px; color: var(--pen-red); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; font-size: 13px; align-items: center; }
.keys dt { white-space: nowrap; }
.set-row.check { cursor: pointer; margin-bottom: 8px; }
.steps { border: 0; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.steps legend { padding: 0; margin-bottom: 4px; }
#rm_steps { display: flex; flex-wrap: wrap; gap: 6px; }
#rm_steps label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 16px; border: 1px solid var(--rule-2); background: var(--sheet); cursor: pointer; font-size: 12.5px; }
#rm_steps label:has(input:checked) { border-color: var(--pen-blue); background: var(--wash-blue); color: var(--ink); }
#rm_steps input { accent-color: var(--pen-blue); margin: 0; width: 15px !important; height: 15px; padding: 0; }
.steps { flex-basis: 100%; }
#rm_steps label { display: inline-flex !important; }
.check-inline { display: inline-flex !important; grid-auto-flow: column; align-items: center; gap: 8px !important; cursor: pointer; flex-basis: 100%; }
.check-inline input { width: 16px !important; height: 16px; accent-color: var(--pen-blue); }
.form-acts { display: flex; gap: 8px; flex-basis: 100%; }
.rm-list { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; }
.rm-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--rule); }
.rm-list .aside { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.rm-h { font-size: 12px; color: var(--ink-3); margin: 12px 0 2px; font-weight: 560; }
.set-row.check input { width: 18px; height: 18px; accent-color: var(--pen-blue); } .keys dd { margin: 0; color: var(--ink-2); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 6px 11px; font-size: 13.5px; font-weight: 550; color: var(--ink-3); border-radius: 7px; cursor: pointer; white-space: nowrap; transition: color .15s, background .15s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--sheet); box-shadow: var(--shadow); }
.tabs .count { font-size: 12px; color: var(--ink-3); margin-left: 4px; font-weight: 500; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; width: 100%; }
.filters:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 20px; padding: 2px 10px 2px 8px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .5; background: none; }
.chip[aria-pressed="false"] .sw { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.search { flex: 1; min-width: 180px; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 7px; padding: 5px 10px; font-size: 13px; }
.search::placeholder { color: var(--ink-3); }
.panel { display: none; padding-top: 22px; }
.view > .panel:first-child, #v-fallbacks .card + .grid2 { padding-top: 0; }
.panel.on { display: block; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px 40px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 40px; }
.block { min-width: 0; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--rule-2); padding-bottom: 6px; margin-bottom: 12px; }
.block-head h3 { margin: 0; }
.block-head .aside { font-size: 12.5px; color: var(--ink-3); }
.insight { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; max-width: 62ch; }

/* timeline (the old recorder, now a detail) */
.sheet { position: relative; background: var(--sheet); border-radius: 12px; box-shadow: var(--shadow); }
#recorder { display: block; width: 100%; user-select: none; }
#recorder text { font-family: var(--sans); fill: var(--ink-2); }
.rec-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 16px 12px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-3); }

.key-line { width: 18px; height: 0; border-top: 2px solid var(--ink); display: inline-block; }
.key-dash { border-top-style: dashed; }
.key-red { border-top-color: var(--pen-red); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 7px; padding: 8px 10px; font-size: 12px; line-height: 1.45; min-width: 170px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); opacity: 0; transition: opacity .12s; z-index: 4; }
.tip.on { opacity: 1; }
.tip b { font-weight: 600; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; }
.tip .row span:first-child { opacity: .75; }

/* notes */
.notes { list-style: none; margin: 0; padding: 0; max-width: 820px; }
.notes li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 3px 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: start; }

.notes-foot { margin-top: 14px; max-width: 820px; }

/* ranked bar lists */
.ranks { display: grid; gap: 8px; }
.rank { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 3px 12px; align-items: center; }
.rank .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rank .val { text-align: right; font-size: 12.5px; }

.stackbar { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; }
.stackbar span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { font-weight: 550; color: var(--ink); }

svg.chart { display: block; width: 100%; overflow: visible; }
svg.chart text { font-family: var(--sans); font-size: 11px; fill: var(--ink-3); }
svg.chart .axis { stroke: var(--rule-2); stroke-width: 1; }
svg.chart .gl { stroke: var(--rule); stroke-width: 1; }
.chart-wrap { position: relative; }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-3); padding: 7px 8px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
.th-btn { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: inherit; }
th[data-s]:hover { color: var(--ink); }
th.r, td.r { text-align: right; }
td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.r { white-space: nowrap; }
tr:hover td { background: var(--band); }
.cell-title { max-width: 440px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-sub { font-size: 12px; color: var(--ink-3); }
.inline-bar { height: 4px; background: var(--track); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.inline-bar span { display: block; height: 100%; background: var(--ink-2); border-radius: 2px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.status-failed { color: var(--pen-red); }
.status-running { color: var(--pen-blue); }
.table-foot { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
#agents button.btn:disabled { visibility: hidden; }
.empty { color: var(--ink-3); padding: 18px 0; font-size: 13px; }
select.sel { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 7px; padding: 4px 6px; font-size: 12.5px; max-width: 220px; }

.counts { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 26px; }
.counts > div { padding: 2px 22px 2px 0; margin-right: 22px; border-right: 1px solid var(--rule); }
.counts > div:last-child { border-right: 0; }
.counts .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.counts .l { font-size: 12.5px; color: var(--ink-3); }

pre.log { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--ink-3); white-space: pre-wrap; margin: 8px 0 0; max-height: 180px; overflow: auto; border-left: 2px solid var(--rule); padding-left: 10px; }
.switch { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.switch-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.fb-row { display: grid; grid-template-columns: minmax(170px, 1fr) minmax(0, 3.2fr) auto; gap: 8px 18px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: center; }
.fb-name b { display: block; }

.fb-step { display: inline-flex; flex-direction: column; border: 1px solid var(--rule-2); border-radius: 7px; padding: 4px 9px; font-size: 12px; line-height: 1.35; background: var(--sheet); min-width: 0; }
.fb-step .m { font-size: 12.5px; color: var(--ink); font-weight: 500; }
.fb-step .r { color: var(--ink-3); font-size: 12px; display: flex; align-items: center; gap: 5px; }
.fb-step .ptile.sm { width: 16px; height: 16px; border-radius: 4px; }
.fb-step .ptile.sm .ic { width: 10px; height: 10px; }
.fb-link { display: inline-flex; align-items: center; gap: 6px; }
.fb-add { margin-top: 14px; max-width: 520px; }
.fb-add h3 { font-size: 13px; color: var(--ink-2); }
.menu-list .n { display: grid; }
.fb-step.cur { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.fb-step.closed .m { text-decoration: line-through; text-decoration-color: var(--pen-red); }
.fb-step .st { font-size: 12px; }

.menu { position: relative; }
.menu > summary { list-style: none; }

.menu[open] > summary .ic.sm { transform: rotate(-90deg); }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 8; min-width: 250px; list-style: none; margin: 0; padding: 6px; background: var(--sheet); border-radius: 10px; box-shadow: 0 0 0 1px var(--rule), 0 14px 36px -14px rgba(0,0,0,.35); }
.menu-list button { width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 2px 8px; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.menu-list button:hover:not(:disabled), .menu-list button:focus-visible { background: var(--band); }
.menu-list button:disabled { opacity: .5; cursor: default; }
.menu-list .n { color: var(--ink-3); font-weight: 600; }
.menu-list small { grid-column: 2; color: var(--ink-3); font-size: 12px; }
.fb-edit { display: grid; gap: 6px; margin-top: 8px; }
.fb-edit-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.fb-edit-row input { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 7px; padding: 4px 8px; font-size: 12.5px; width: 230px; }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; }
.events time { color: var(--ink-3); font-size: 12px; }

dialog { border: 0; border-radius: 12px; background: var(--sheet); color: var(--ink); max-width: 500px; width: calc(100% - 32px); padding: 20px 22px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(10, 12, 16, .4); }
dialog h3 { font-size: 16px; margin-bottom: 8px; }
.dlg-text { font-size: 13.5px; margin-bottom: 18px; }
.dlg-text .sub { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 30; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); }
.toast { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--ink); color: var(--paper); padding: 11px 10px 11px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 12px 32px -12px rgba(0,0,0,.5); animation: tin .25s cubic-bezier(.2,.8,.2,1); }
.toast.out { opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
@keyframes tin { from { opacity: 0; transform: translateY(10px); } }
.toast .ic { width: 18px; height: 18px; margin-top: 1px; }
.toast.ok .ic { color: #5cbf89; } .toast.err .ic { color: #f0705f; } .toast.busy .ic { animation: spin .9s linear infinite; }
.toast .msg b { display: block; font-weight: 600; }
.toast pre { margin: 6px 0 0; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; max-height: 160px; overflow: auto; opacity: .8; }
.toast .x { border: 0; background: none; color: inherit; opacity: .6; cursor: pointer; padding: 2px; border-radius: 5px; display: grid; }
.toast .x:hover { opacity: 1; }
.btn .ic { margin-right: 5px; }
.btn.busy { pointer-events: none; opacity: .8; }
.btn.busy::before { content: ""; width: 11px; height: 11px; margin-right: 7px; display: inline-block; vertical-align: -1px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }

/* loading: rows hold their place until the first reading */
.skel { height: 14px; border-radius: 4px; background: linear-gradient(90deg, var(--track) 0%, var(--paper-2) 50%, var(--track) 100%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; display: inline-block; }
@keyframes shimmer { to { background-position: -200% 0; } }

@media (max-width: 1400px) { .cal:not(.month) .ev .tx { display: none; } }
@media (max-width: 1100px) {

}
@media (max-width: 1180px) { .bento { grid-template-columns: 1fr 1fr; } .bento > :first-child { grid-column: 1 / -1; } }
@media (max-width: 900px) {

}

  .lane .tag { display: none; }

  .q { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 8px 12px; padding-left: 16px; padding-right: 16px; }

  .q-more .kids { margin-left: 0; }
  .q-val { display: flex; align-items: center; gap: 8px; }
  .q-when span { display: inline; }

  .quotas .section-head, .q-foot, .rec-note { padding-left: 16px; padding-right: 16px; }

  .seg.qview button span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .pane { padding: 14px 16px 16px; }
  .attention li { grid-template-columns: 16px minmax(0, 1fr); }

// ---------- svg helpers ----------

const PROV = name => /antigravity/i.test(name) ? "antigravity" : /openrouter/i.test(name) ? "openrouter" : /codex/i.test(name) ? "codex" : /claude/i.test(name) ? "claude" : "other";
const ptile = (name, sm) => { const k = PROV(name); return `<span class="ptile ${sm ? "sm" : ""} p-${k}" aria-hidden="true">${k === "other" ? icon("plug") : icon("p-" + k)}</span>`; };
function statusIcon(parent, x, y, st) {  // drawn shapes: square ok, diamond low, triangle empty, ring off
  const c = `var(${STATUS_COLOR[st]})`;
  if (st === "ok") el("rect", {x: x - 3.5, y: y - 3.5, width: 7, height: 7, rx: 1.5, fill: c}, parent);
  else if (st === "low") el("path", {d: `M${x} ${y - 5} L${x + 5} ${y} L${x} ${y + 5} L${x - 5} ${y} Z`, fill: c}, parent);
  else if (st === "empty") el("path", {d: `M${x} ${y - 5} L${x + 5.5} ${y + 4} L${x - 5.5} ${y + 4} Z`, fill: c}, parent);

function levelIcon(level) {

  return `<svg class="lv" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${shape}</svg>`;

// ---------- the recorder ----------
function lanes(v) {
  const L = [], q = v.quotas || {}, H = v.history || {};
  const series = k => (H[k] || []).map(([ts, val]) => [new Date(ts).getTime(), val]);
  L.push({id: "claude", group: "Claude", sub: q.claude?.plan || "", claude: true});
  for (const [name, a] of Object.entries(v.antigravity || {})) {
    if (a.error) { L.push({group: "Antigravity " + name, sub: a.error, error: true}); continue; }
    for (const r of a.rows) {
      const w = /weekly/i.test(r.limit) ? "weekly" : /five hour/i.test(r.limit) ? "5h" : r.limit;
      const n = parseFloat(r.left);
      L.push({group: "Antigravity " + name, sub: `${GROUP(r.group)} · ${WIN(w)}`, left: isNaN(n) ? null : n, off: isNaN(n), reset: r.reset,
        pts: series(`agy|${name}|${r.group}|${w}`), agents: (a.runtimes || []).flatMap(rt => v.runtimes[rt]?.agents || []), note: a.note});
    }
  }
  if (q.codex && !q.codex.error) for (const r of q.codex.rows) L.push({group: "Codex", sub: `${q.codex.plan || ""} · ${WIN(r.window)}`, left: r.left, reset: r.reset, pts: series(`codex|${r.window}`)});
  if (q.openrouter && !q.openrouter.error) {
    const fr = q.openrouter.rows.find(r => r.kind === "free_requests");
    if (fr) L.push({group: "OpenRouter", sub: `${t("free_requests")} · ${fr.remaining}/${fr.limit}`, left: fr.left, pts: series("openrouter|free_requests")});
  }
  return L;
}

function claudeTrace(v) {
  // cumulative Claude $ inside each 5-hour window, from the hourly totals
  const hourly = v.hourly || {}, out = [];
  for (const w of v.recent_windows || []) {
    const s = new Date(w.start).getTime(), close = new Date(w.close).getTime(), end = w.active ? Date.now() : new Date(w.end || w.close).getTime();
    let cum = 0; const pts = [[s, 0]];
    for (let h = s; h < Math.min(close, end); h += 3600e3) {
      const key = new Date(h).toISOString().slice(0, 13);
      cum += Object.values(hourly[key] || {}).reduce((a, b) => a + b, 0);
      pts.push([Math.min(h + 3600e3, end), cum]);
    }
    out.push({start: s, close, end, active: w.active, usd: w.usd, pts});
  }
  return out;
}

function drawRecorder(v) {
  const svg = $("recorder"), W = $("sheet").clientWidth, narrow = W < 760;
  svg.innerHTML = "";
  svg.setAttribute("aria-label", t("tab_timeline"));
  const LW = narrow ? 0 : 216, RW = narrow ? 0 : 236, PADT = 30, laneH = narrow ? 70 : 46, claudeH = narrow ? 200 : 168;
  const L = lanes(v), nOther = L.length - 1;
  const H = PADT + claudeH + nOther * laneH + 26;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  const now = Date.now(), t0 = now - (narrow ? 10 : 18) * 3600e3, t1 = now + 6 * 3600e3;
  const px0 = LW + 14, px1 = W - RW - 14;
  const x = tm => px0 + (Math.max(t0, Math.min(t1, tm)) - t0) / (t1 - t0) * (px1 - px0);
  const g = el("g", {}, svg);

  // hour ticks
  const first = Math.ceil(t0 / 3600e3) * 3600e3;
  for (let h = first; h <= t1; h += 3600e3) {
    const d = new Date(h), major = d.getHours() % 3 === 0;
    el("line", {x1: x(h), x2: x(h), y1: PADT - 6, y2: H - 22, stroke: major ? cssv("--rule-2") : "transparent", "stroke-width": 1}, g);
    if (major) txt(g, x(h), H - 8, d.toLocaleTimeString(loc(), {hour: "2-digit", minute: "2-digit"}), {"text-anchor": "middle", "font-size": 10.5, class: "mono", fill: cssv("--ink-3")});
    if (d.getHours() === 0) txt(g, x(h) + 4, PADT - 12, d.toLocaleDateString(loc(), {weekday: "short", day: "numeric"}), {"font-size": 10.5, fill: cssv("--ink-3")});
  }

  // claude lane: windows, cap, ink trace, pace
  const cy0 = PADT, cy1 = PADT + claudeH - 14, w = v.window, cap = w?.cap;
  const traces = claudeTrace(v);
  const ymax = Math.max(cap || 0, ...traces.map(tr => tr.pts.at(-1)[1]), w ? w.usd : 0, 1) * 1.12;
  const ctop = cy0 + (narrow ? 58 : 8);
  const y = val => cy1 - val / ymax * (cy1 - ctop);
  for (const tr of traces) {
    if (tr.close < t0) continue;
    el("rect", {x: x(tr.start), y: cy0, width: Math.max(0, x(tr.close) - x(tr.start)), height: cy1 - cy0, fill: tr.active ? cssv("--wash-blue") : cssv("--band")}, g);
    if (!narrow) txt(g, x(tr.start) + 5, cy0 + 12, `${hm(tr.start)}–${hm(tr.close)}`, {"font-size": 10, class: "mono", fill: cssv("--ink-3")});
  }
  if (cap) {
    el("line", {x1: px0, x2: px1, y1: y(cap), y2: y(cap), stroke: cssv("--pen-red"), "stroke-width": 1.5}, g);
    txt(g, px0 + 4, y(cap) - 5, `${t("cap")} ${usd0(cap)} · ${t("est")}`, {"font-size": 10.5, fill: cssv("--pen-red")});
  }
  for (const tr of traces) {
    const pts = tr.pts.filter(p => p[0] >= t0 - 3600e3);
    if (pts.length < 2) continue;
    const d = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`).join(" ");
    const path = el("path", {d, fill: "none", stroke: cssv("--ink"), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", class: "ink"}, g);
    if (tr.active && w) {
      const last = pts.at(-1), endT = w.full_before_end ? new Date(w.full_at).getTime() : tr.close;
      const endV = last[1] + w.per_hour * (endT - last[0]) / 3600e3;
      el("path", {d: `M${x(last[0])} ${y(last[1])} L${x(endT)} ${y(Math.min(endV, ymax / 1.12))}`, stroke: w.full_before_end ? cssv("--pen-red") : cssv("--ink-2"), "stroke-width": 1.6, "stroke-dasharray": "5 4", fill: "none"}, g);
      el("circle", {cx: x(last[0]), cy: y(last[1]), r: 4, fill: cssv("--ink"), stroke: cssv("--sheet"), "stroke-width": 2}, g);
      if (w.full_before_end) {
        const fx = x(endT), fy = y(cap);
        el("circle", {cx: fx, cy: fy, r: 4.5, fill: "none", stroke: cssv("--pen-red"), "stroke-width": 1.8}, g);
        const label = t("fills_at", {t: hm(w.full_at)});
        const lw = label.length * 6.6 + 14, lx = Math.min(fx + 8, px1 - lw);
        el("rect", {x: lx, y: fy - 30, width: lw, height: 19, rx: 3, fill: cssv("--sheet"), stroke: cssv("--pen-red"), "stroke-width": 1}, g);
        txt(g, lx + 7, fy - 16.5, label, {"font-size": 11.5, fill: cssv("--pen-red"), "font-weight": 600});
      }
    }
  }
  // lane labels and readouts

    if (narrow) { txt(g, 12, yy, (first ? a + " · " : "") + (b || ""), {"font-size": 12, fill: cssv("--ink"), "font-weight": 600}); return; }
    if (first) txt(g, 16, yy - 6, a, {"font-size": 12.5, "font-weight": 650, fill: cssv("--ink")});
    if (b) txt(g, 16, yy + (first ? 9 : 3), b, {"font-size": 11.5, fill: cssv("--ink-3")});
  };
  const readout = (yy, big, small, st) => {
    if (narrow) { if (st) statusIcon(g, 16, yy - 4, st); txt(g, st ? 26 : 12, yy, `${big}${small ? " · " + small : ""}`, {"font-size": 11, fill: cssv("--ink-2")}); return; }
    const rx = W - RW + 6;
    if (st) statusIcon(g, rx + 4, yy - 9, st);
    txt(g, rx + 15, yy - 4, big, {"font-size": 15, class: "mono", fill: cssv("--ink"), "font-weight": 500});
    txt(g, rx + 15, yy + 11, small, {"font-size": 11, fill: cssv("--ink-3")});
  };
  const cMid = (cy0 + cy1) / 2;
  label(narrow ? cy0 + 16 : cMid, "Claude", L[0].sub, true);
  const manual = v.quotas?.claude?.manual;
  if (w && cap) {
    const leftPct = Math.max(0, 100 - w.usd / cap * 100);
    readout(narrow ? cy0 + 32 : cMid - 14, `${pc(leftPct)} ${t("left")}`, `${t("est")} · ${t("resets_in", {d: until(w.end)})}`, statusOf(leftPct));
    readout(narrow ? cy0 + 47 : cMid + 24, `${usd(w.usd)}`, `${t("per_hour", {v: usd(w.per_hour)})} · ${w.full_before_end ? t("fills_at", {t: hm(w.full_at)}) : t("safe_until", {e: hm(w.end)})}`);
  } else readout(cMid, t("no_window"), "", "off");
  if (!narrow) {
    const btnY = cy1 + 2;
    const mt = manual && ["five_hour", "weekly", "weekly_model"].some(k => manual[k] != null)
      ? [manual.five_hour != null ? `${t("h5_short")} ${pc(manual.five_hour)}` : "", manual.weekly != null ? `${t("week_short")} ${pc(manual.weekly)}` : "", manual.weekly_model != null ? `model ${pc(manual.weekly_model)}` : ""].filter(Boolean).join(" · ") + ` ${t("used")} · ${ago(manual.at)}` : "";
    if (mt) txt(g, 16, btnY - 22, `${t("from_app")}: ${mt}`, {"font-size": 11, fill: cssv("--ink-3")});
    const b = txt(g, 16, btnY - 6, t("set_app"), {"font-size": 11.5, fill: cssv("--pen-blue"), "text-decoration": "underline", style: "cursor:pointer", tabindex: 0, role: "button"});
    const toApp = () => go("settings", "claude"); b.addEventListener("click", toApp); b.addEventListener("keydown", e => (e.key === "Enter" || e.key === " ") && toApp());
  }
  el("line", {x1: 0, x2: W, y1: cy1 + 10, y2: cy1 + 10, stroke: cssv("--rule-2")}, g);

  // other lanes
  const laneFns = [];
  let prevGroup = null;
  L.slice(1).forEach((ln, i) => {
    const top = cy1 + 10 + i * laneH, bot = top + laneH, ly0 = top + (narrow ? 42 : 9), ly1 = bot - 8;
    const ly = val => ly1 - val / 100 * (ly1 - ly0);
    const first = ln.group !== prevGroup; prevGroup = ln.group;
    if (first && i) el("line", {x1: 0, x2: W, y1: top, y2: top, stroke: cssv("--rule-2")}, g);
    else if (i) el("line", {x1: LW + (narrow ? 0 : 10), x2: W, y1: top, y2: top, stroke: cssv("--rule"), "stroke-dasharray": "2 3"}, g);
    const mid = (top + bot) / 2;
    label(narrow ? top + 17 : mid, narrow ? ln.group : ln.group, ln.sub, first || narrow);
    if (ln.error) { txt(g, px0, mid + 4, ln.sub, {"font-size": 11.5, fill: cssv("--pen-red")}); return; }
    el("line", {x1: px0, x2: px1, y1: ly(0), y2: ly(0), stroke: cssv("--pen-red"), "stroke-width": 1, opacity: .22}, g);
    if (ln.off) { if (!narrow) txt(g, px0 + 4, mid + 4, t("status_off"), {"font-size": 11, fill: cssv("--ink-3")}); readout(narrow ? top + 33 : mid, t("status_off"), "", "off"); return; }
    const pts = [...(ln.pts || [])].filter(p => p[0] >= t0 - 6 * 3600e3);
    if (!pts.length || now - pts.at(-1)[0] > 60e3) pts.push([now, ln.left]);
    // step trace: a reading holds until the next one
    let d = "";
    pts.forEach((p, k) => { const px = x(p[0]), py = ly(p[1]); d += k ? `H${px.toFixed(1)}V${py.toFixed(1)}` : `M${px.toFixed(1)} ${py.toFixed(1)}`; });
    d += `H${x(now).toFixed(1)}`;
    el("path", {d, fill: "none", stroke: cssv("--ink"), "stroke-width": 2, "stroke-linejoin": "round", class: "ink"}, g);
    el("circle", {cx: x(now), cy: ly(ln.left), r: 4, fill: cssv("--ink"), stroke: cssv("--sheet"), "stroke-width": 2}, g);
    // pace from the readings of the last 3 hours, if it is falling
    const recent = pts.filter(p => p[0] >= now - 3 * 3600e3);
    let emptyAt = null;
    const reset = ln.reset ? new Date(ln.reset).getTime() : null;
    // only a real trend: readings at least 30 minutes apart that fell by 2 points or more
    if (recent.length >= 2 && recent.at(-1)[0] - recent[0][0] >= 30 * 60e3 && recent[0][1] - recent.at(-1)[1] >= 2) {
      const slope = (recent.at(-1)[1] - recent[0][1]) / (recent.at(-1)[0] - recent[0][0]);
      emptyAt = now + ln.left / -slope;
      const stop = Math.min(emptyAt, reset || Infinity, t1);
      el("path", {d: `M${x(now)} ${ly(ln.left)} L${x(stop)} ${ly(Math.max(0, ln.left + slope * (stop - now)))}`, stroke: emptyAt < (reset || Infinity) ? cssv("--pen-red") : cssv("--ink-2"), "stroke-width": 1.5, "stroke-dasharray": "5 4", fill: "none"}, g);
    }
    if (reset && reset <= t1) {
      const rx = x(reset);
      el("path", {d: `M${rx} ${ly1 + 2} V${ly0 - 2} l6 3 l-6 3`, stroke: cssv("--pen-red"), "stroke-width": 1.4, fill: cssv("--pen-red")}, g);
      el("path", {d: `M${rx} ${ly(ln.left)} H${rx} V${ly(100)} H${Math.min(px1, rx + 40)}`, stroke: cssv("--ink-3"), "stroke-width": 1.2, "stroke-dasharray": "2 3", fill: "none"}, g);
    } else if (reset && !narrow) txt(g, px1, ly0 + 2, `→ ${dayHm(ln.reset)}`, {"text-anchor": "end", "font-size": 10.5, fill: cssv("--ink-3")});
    const st = statusOf(ln.left);
    const small = emptyAt && emptyAt < (reset || Infinity) && emptyAt < now + 7 * 864e5 ? t("empty_at", {t: when(new Date(emptyAt))}) : reset ? t("resets_in", {d: until(ln.reset)}) : t("no_reset");
    readout(narrow ? top + 33 : mid, `${pc(ln.left)} ${t("left")}`, small, st);
    laneFns.push({name: `${ln.group} · ${ln.sub}`, at: tm => { let val = null; for (const p of pts) { if (p[0] <= tm) val = p[1]; } return tm > now ? null : val; }, fmt: val => pc(val)});
  });

  // now
  el("line", {x1: x(now), x2: x(now), y1: PADT - 8, y2: H - 22, stroke: cssv("--pen-blue"), "stroke-width": 1.5}, g);
  txt(g, x(now), PADT - 12, t("rec_now"), {"text-anchor": "middle", "font-size": 10.5, fill: cssv("--pen-blue"), "font-weight": 600});

  // first draw: the pen writes the ink in
  if (!drawnOnce && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    svg.querySelectorAll("path.ink").forEach(p => { const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.getBoundingClientRect(); p.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)"; p.style.strokeDashoffset = 0; setTimeout(() => { p.style.strokeDasharray = ""; p.style.transition = ""; }, 1200); });
    drawnOnce = true;
  }

  // crosshair
  const cross = el("line", {y1: PADT - 6, y2: H - 22, stroke: cssv("--ink-2"), "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden"}, svg);
  const hit = el("rect", {x: px0, y: 0, width: px1 - px0, height: H, fill: "transparent"}, svg);
  const tip = $("rec_tip");
  const cum = tm => { for (const tr of traces) if (tm >= tr.start && tm <= Math.max(tr.end, tr.start)) { let val = 0; for (const p of tr.pts) if (p[0] <= tm) val = p[1]; return val; } return null; };
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * (W / r.width);
    const tm = t0 + (mx - px0) / (px1 - px0) * (t1 - t0);
    cross.setAttribute("x1", mx); cross.setAttribute("x2", mx); cross.setAttribute("visibility", "visible");
    const c = cum(tm);
    const rows = [[`Claude ${t("used")}`, c != null && tm <= now ? usd(c) : "–"], ...laneFns.map(f => { const val = f.at(tm); return [f.name, val == null ? "–" : f.fmt(val)]; })];
    tip.innerHTML = `<div style="margin-bottom:4px"><b>${esc(dayHm(new Date(tm)))}</b></div>` + rows.map(([a, b]) => `<div class="row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join("");
    const tw = tip.offsetWidth || 220, left = (e.clientX - r.left) + 14;
    tip.style.left = (left + tw > r.width ? left - tw - 28 : left) + "px"; tip.style.top = "36px"; tip.classList.add("on");
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); tip.classList.remove("on"); });

  $("rec_legend").innerHTML = `<span><i class="key-line"></i>${esc(t("lg_ink"))}</span><span><i class="key-line key-dash"></i>${esc(t("lg_pace"))}</span><span><i class="key-line key-red"></i>${esc(t("lg_cap"))}</span>
    <span><svg width="10" height="12" aria-hidden="true"><path d="M1 11 V1 l6 3 l-6 3" stroke="var(--pen-red)" fill="var(--pen-red)" stroke-width="1.3"/></svg>${esc(t("lg_reset"))}</span>`;
}

// ---------- advice (notes) ----------
function adviceText(rule, p) {
  const P = {...p};
  for (const k of ["usd", "total", "cap", "per_hour"]) if (P[k] != null) P[k] = usd(P[k]);

const SUBS = {spend: ["summary", "sessions"], agents: ["models", "runs"]};
function renderControls(v) {
  const view = F.view;
  if (!v.multica && F.sub.agents === "runs") F.sub.agents = "models";
  document.querySelectorAll("[data-multica]").forEach(e => e.style.display = v.multica ? "" : "none");
  for (const [vw, subs] of Object.entries(SUBS)) {
    $(vw + "_tabs").querySelectorAll("button").forEach(b => { const on = b.dataset.sub === F.sub[vw]; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; b.id = "tab-" + b.dataset.sub; b.setAttribute("aria-controls", "p-" + b.dataset.sub); });
    for (const sb of subs) { const p = $("p-" + sb); p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", "tab-" + sb); p.classList.toggle("on", F.sub[vw] === sb); }
  }
  // one filter bar, moved into whichever section needs it
  const fl = $("filters");
  if (view === "agents" && fl.parentElement !== $("agents_slot")) $("agents_slot").appendChild(fl);
  if (view === "spend" && fl.parentElement !== $("v-spend").querySelector(".subbar")) $("v-spend").querySelector(".subbar").appendChild(fl);
  $("span").innerHTML = SPANS.map(s => `<button type="button" data-v="${s}" aria-pressed="${s === F.span}">${esc(t("span_" + s))}</button>`).join("");
  $("span").querySelectorAll("button").forEach(b => b.onclick = () => { F.span = b.dataset.v; save(); draw(); });
  const kinds = KINDS.filter(k => v.multica || k !== "multica");
  $("kinds").innerHTML = kinds.map(k => `<button type="button" class="chip" data-k="${k}" aria-pressed="${F.kinds.includes(k)}"><i class="sw" style="background:var(${KVAR(k)})"></i>${esc(t("k_" + k))}</button>`).join("");
  $("kinds").querySelectorAll("button").forEach(b => b.onclick = () => { const k = b.dataset.k; F.kinds = F.kinds.includes(k) ? F.kinds.filter(x => x !== k) : [...F.kinds, k]; save(); draw(); });
  $("span").hidden = $("kinds").hidden = view !== "spend";
  $("search").placeholder = t("search");
  $("search").setAttribute("aria-label", t("search"));
  if (document.activeElement !== $("search")) $("search").value = F.search;
}
for (const vw of Object.keys(SUBS)) {
  const tl = $(vw + "_tabs");
  tl.querySelectorAll("button").forEach(b => b.onclick = () => go(vw, b.dataset.sub));
  tl.addEventListener("keydown", e => {
    const bs = [...tl.querySelectorAll("button")].filter(b => b.style.display !== "none"), i = bs.findIndex(b => b.dataset.sub === F.sub[vw]);
    const j = {ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: bs.length - 1}[e.key];
    if (j == null) return;
    e.preventDefault(); const b = bs[(j + bs.length) % bs.length]; go(vw, b.dataset.sub); b.focus();
  });
}
$("search").oninput = e => { F.search = e.target.value; save(); draw(); };

// ---------- generic pieces ----------
function ranks(id, items, {color = () => "--ink-2", sub = () => "", fmt = usd, limit = 8} = {}) {
  const max = Math.max(1e-9, ...items.map(i => i.v));
  const shown = items.slice(0, limit), rest = items.slice(limit);
  if (rest.length) shown.push({n: t("other") + ` (${rest.length})`, v: rest.reduce((a, i) => a + i.v, 0), other: true});
  $(id).innerHTML = items.length ? `<div class="ranks">${shown.map(i => `<div class="rank" title="${esc(i.n)}"><div class="name">${esc(i.n)}${sub(i) ? `<small>${esc(sub(i))}</small>` : ""}</div><div class="val">${fmt(i.v)}</div>
    <div class="track">${(i.parts || [{v: i.v, c: i.other ? "--rule-2" : color(i)}]).map(p => `<span style="width:${p.v / max * 100}%;background:var(${p.c})" title="${esc(p.n || "")}"></span>`).join("")}</div></div>`).join("")}</div>`
    : `<div class="empty">${esc(t("nothing_match"))}</div>`;
}
function columns(id, items, {h = 170, cap, label, title, legend}) {
  const host = $(id), W = host.clientWidth || 500, PL = 40, PB = 22, PT = 10;
  const max = Math.max(cap || 0, ...items.map(i => i.total), 1) * 1.08;
  const n = items.length, slot = (W - PL) / Math.max(n, 1), bw = Math.min(24, slot * .62);
  const y = val => PT + (h - PT - PB) * (1 - val / max);
  const svg = el("svg", {class: "chart", viewBox: `0 0 ${W} ${h}`, height: h, role: "img",
    "aria-label": items.map((it, i) => `${(label(it, i) || "").trim() || i + 1}: ${usd(it.total)}`).join(", ")});
  const step = niceStep(max);
  for (let tk = 0; tk <= max; tk += step) { el("line", {x1: PL, x2: W, y1: y(tk), y2: y(tk), class: "gl"}, svg); txt(svg, PL - 6, y(tk) + 3.5, usd0(tk), {"text-anchor": "end", class: "mono"}); }
  if (cap) { el("line", {x1: PL, x2: W, y1: y(cap), y2: y(cap), stroke: cssv("--pen-red"), "stroke-width": 1.5}, svg); txt(svg, W, y(cap) - 5, `${t("cap")} ${usd0(cap)}`, {"text-anchor": "end", fill: cssv("--pen-red")}); }
  const tip = host.querySelector(".tip") || Object.assign(document.createElement("div"), {className: "tip"});
  items.forEach((it, i) => {
    const cx = PL + slot * i + slot / 2;
    let acc = 0;
    const segs = it.parts.filter(p => p.v > 0);
    segs.forEach((p, k) => {
      const y1 = y(acc + p.v), y0 = y(acc); acc += p.v;
      const top = k === segs.length - 1, hgt = Math.max(0, y0 - y1 - (k ? 2 : 0));
      el("path", {d: top ? roundTop(cx - bw / 2, y1, bw, hgt, Math.min(4, hgt)) : `M${cx - bw / 2} ${y1}h${bw}v${hgt}h${-bw}Z`, fill: `var(${p.c})`}, svg);
    });
    if (label(it, i)) txt(svg, cx, h - 6, label(it, i), {"text-anchor": "middle", class: "mono", "font-size": 10.5});
    const hitR = el("rect", {x: cx - slot / 2, y: 0, width: slot, height: h - PB, fill: "transparent"}, svg);
    hitR.addEventListener("mousemove", e => { const r = host.getBoundingClientRect(); tip.innerHTML = title(it); tip.style.left = Math.min(e.clientX - r.left + 12, r.width - 200) + "px"; tip.style.top = "0px"; tip.classList.add("on"); });
    hitR.addEventListener("mouseleave", () => tip.classList.remove("on"));
  });
  host.innerHTML = ""; host.appendChild(svg); host.appendChild(tip);
  if (legend) host.insertAdjacentHTML("beforeend", legend);
}
const roundTop = (x0, y0, w, h, r) => `M${x0} ${y0 + h}V${y0 + r}q0 ${-r} ${r} ${-r}h${w - 2 * r}q${r} 0 ${r} ${r}V${y0 + h}Z`;
function niceStep(max) { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2.5 : n < 7.5 ? 5 : 10) * p; }
const tipRows = (head, rows) => `<div style="margin-bottom:4px"><b>${esc(head)}</b></div>` + rows.map(([a, b]) => `<div class="row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join("");
const legendHtml = items => `<div class="legend">${items.map(i => `<span><i class="sw" style="background:var(${i.c})"></i>${esc(i.n)}${i.v != null ? ` <b>${esc(i.v)}</b>` : ""}</span>`).join("")}</div>`;

// ---------- spending ----------
function renderSpend(v) {
  const ss = sessions(v), f = F.span, total = ss.reduce((a, r) => a + r[f], 0);
  const kinds = KINDS.filter(k => F.kinds.includes(k)).map(k => ({n: t("k_" + k), c: KVAR(k), v: ss.filter(r => r.kind === k).reduce((a, r) => a + r[f], 0)}));
  $("who_aside").textContent = t("total_f", {v: usd(total)}) + " · " + t("sessions_n", {n: ss.length});
  const top = ss.slice().sort((a, b) => b[f] - a[f]);
  $("who").innerHTML = `<div class="stackbar">${kinds.filter(k => k.v > 0).map(k => `<span style="flex:${k.v};background:var(${k.c})" title="${esc(k.n)} ${usd(k.v)}"></span>`).join("")}</div>
    ${legendHtml(kinds.filter(k => k.v > 0).map(k => ({...k, v: usd(k.v)})))}<div style="margin-top:18px" id="who_top"></div>`;
  ranks("who_top", top.map(r => ({n: nameOf(r), v: r[f], kind: r.kind, sub: r.project})), {color: i => KVAR(i.kind), limit: 7});

  // heatmap: 7 local days × 24 hours
  const host = $("heat"), W = host.clientWidth || 520, PL = 46, PT = 16, rows = 7, cw = (W - PL) / 24, ch = 22;
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 6 + i); return d; });
  const cell = {};
  for (const [h, kinds_] of Object.entries(v.hourly || {})) {
    const d = new Date(h + ":00:00Z"), key = d.toDateString() + "|" + d.getHours();
    cell[key] = (cell[key] || 0) + Object.entries(kinds_).filter(([k]) => F.kinds.includes(k)).reduce((a, [, x]) => a + x, 0);
  }
  const vals = Object.values(cell), hmax = Math.max(1e-9, ...vals);
  const svg = el("svg", {class: "chart", viewBox: `0 0 ${W} ${PT + rows * ch + 22}`, height: PT + rows * ch + 22});
  const tip = Object.assign(document.createElement("div"), {className: "tip"});
  for (let hh = 0; hh < 24; hh += 3) txt(svg, PL + hh * cw + cw / 2, 10, String(hh).padStart(2, "0"), {"text-anchor": "middle", class: "mono", "font-size": 10});
  days.forEach((d, r) => {
    txt(svg, PL - 8, PT + r * ch + ch / 2 + 4, d.toLocaleDateString(loc(), {weekday: "short"}), {"text-anchor": "end"});
    for (let hh = 0; hh < 24; hh++) {
      const val = cell[d.toDateString() + "|" + hh] || 0, lvl = val <= 0 ? 0 : Math.min(5, 1 + Math.floor(Math.sqrt(val / hmax) * 5));
      const rc = el("rect", {x: PL + hh * cw + 1, y: PT + r * ch + 1, width: cw - 2, height: ch - 2, rx: 2, fill: `var(--heat-${lvl})`}, svg);
      rc.addEventListener("mousemove", e => { const b = host.getBoundingClientRect(); tip.innerHTML = tipRows(`${d.toLocaleDateString(loc(), {weekday: "long", day: "numeric", month: "short"})} ${String(hh).padStart(2, "0")}:00`, [["Claude", usd(val)]]); tip.style.left = Math.min(e.clientX - b.left + 12, b.width - 180) + "px"; tip.style.top = (e.clientY - b.top + 12) + "px"; tip.classList.add("on"); });
      rc.addEventListener("mouseleave", () => tip.classList.remove("on"));
    }
  });
  const ly = PT + rows * ch + 14;
  txt(svg, PL, ly, "$0", {class: "mono", "font-size": 10});
  for (let i = 1; i <= 5; i++) el("rect", {x: PL + 24 + (i - 1) * 16, y: ly - 9, width: 14, height: 10, rx: 2, fill: `var(--heat-${i})`}, svg);
  txt(svg, PL + 24 + 5 * 16 + 4, ly, usd(hmax), {class: "mono", "font-size": 10});
  host.innerHTML = ""; host.appendChild(svg); host.appendChild(tip);

  // by day and kind
  const byDay = days.map(d => { const parts = {}; for (const [h, kk] of Object.entries(v.hourly || {})) { const hd = new Date(h + ":00:00Z"); if (hd.toDateString() === d.toDateString()) for (const [k, x] of Object.entries(kk)) parts[k] = (parts[k] || 0) + x; } return {d, parts}; });
  const ks = KINDS.filter(k => F.kinds.includes(k));
  columns("by_day", byDay.map(b => ({total: ks.reduce((a, k) => a + (b.parts[k] || 0), 0), d: b.d, parts: ks.map(k => ({v: b.parts[k] || 0, c: KVAR(k), n: t("k_" + k)}))})),
    {label: it => it.d.toLocaleDateString(loc(), {weekday: "short"}), title: it => tipRows(it.d.toLocaleDateString(loc(), {weekday: "long", day: "numeric", month: "short"}), [...it.parts.filter(p => p.v > 0).map(p => [p.n, usd(p.v)]), ["Σ", usd(it.total)]]),
     legend: legendHtml(ks.map(k => ({n: t("k_" + k), c: KVAR(k)})))});

  // models by day (ccusage)
  const allM = [...new Set(v.daily.flatMap(d => Object.keys(d.models).filter(m => d.models[m] > 0)))];
  columns("models_daily", v.daily.map(d => ({total: d.usd, day: d.day, parts: allM.map(m => ({v: d.models[m] || 0, c: MVAR(m), n: MNAME(m)}))})),
    {label: (it, i) => i % 3 === 0 || i === v.daily.length - 1 ? it.day.slice(8) : "", title: it => tipRows(it.day, [...it.parts.filter(p => p.v > 0).map(p => [p.n, usd(p.v)]), ["Σ", usd(it.total)]]),
     legend: legendHtml(allM.map(m => ({n: MNAME(m), c: MVAR(m)})))});

  // token anatomy
  const span = f === "week" ? "week" : "today", tt = v.token_types?.[span];
  if (tt) {
    const names = ["t_input", "t_output", "t_write", "t_read"], cols = ["--t-input", "--t-output", "--t-write", "--t-read"];
    const ts_ = tt.tokens.reduce((a, b) => a + b, 0) || 1, cs = tt.usd.reduce((a, b) => a + b, 0) || 1;
