<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quotaboard</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e4e2da; --soft: #efede6;
  --red: #c2412d; --amber: #b7791f; --green: #2f7d4f; --blue: #2b5fa8;
  --m-opus: #6f4cc3; --m-fable: #d0562b; --m-sonnet: #2b7fa8; --m-haiku: #4a9b6e; --m-other: #9a9890;
  --k-long: #d0562b; --k-multica: #2b5fa8; --k-scheduled: #b7791f; --k-side: #7a6fb0; --k-interactive: #4a9b6e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9c9a92; --line: #33322e; --soft: #2a2a27;
    --red: #e46b55; --amber: #d9a443; --green: #5cb47f; --blue: #6b9be0;
    --m-opus: #9b7fe6; --m-fable: #ec7a50; --m-sonnet: #57a9d1; --m-haiku: #6cc08f; --m-other: #77756d;
    --k-long: #ec7a50; --k-multica: #6b9be0; --k-scheduled: #d9a443; --k-side: #a197d6; --k-interactive: #6cc08f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
h1 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 10px; }
h3 { font-size: 12.5px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); } .small { font-size: 12px; } .num { font-variant-numeric: tabular-nums; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
section { margin-top: 14px; }
.grid { display: grid; gap: 12px; }
.quotas { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
@media (max-width: 520px) { .g2 { grid-template-columns: 1fr; } }
.quota h2 { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
.quota .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.limit { margin-top: 9px; }
.limit .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.limit .top b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.limit .reset { font-size: 11.5px; color: var(--muted); }
.bar { position: relative; height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar > span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; }
.stack { display: flex; height: 12px; border-radius: 4px; overflow: hidden; background: var(--soft); }
.stack span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.note { background: var(--soft); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th[data-s] { cursor: pointer; user-select: none; } th[data-s]:hover { color: var(--ink); }
td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; } td.r { font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.scroll { overflow-x: auto; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.adv { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
.adv:last-child { border-bottom: 0; }
.lvl { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; }
.lvl.high { background: var(--red); } .lvl.medium { background: var(--amber); } .lvl.low { background: var(--muted); }
.adv .why { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
button { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button.danger { color: var(--red); border-color: var(--red); }
button.link { border: 0; padding: 0; background: none; color: var(--blue); }
button:disabled { opacity: .45; cursor: default; }
select, input { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 100%; }
input[type=number] { width: 70px; }
.filters { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-radius: 0; padding: 5px 12px; }
.seg button.on { background: var(--ink); color: var(--panel); }
.chip { border-radius: 14px; padding: 3px 10px; font-size: 12.5px; }
.chip.off { opacity: .45; text-decoration: line-through; }
.tabs { display: flex; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; color: var(--muted); font-weight: 600; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.tab { display: none; } .tab.on { display: block; }
.chart { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 8px; }
.chart .col { flex: 1; display: flex; flex-direction: column-reverse; min-width: 6px; }
.chart .col:hover { outline: 1px solid var(--muted); }
.xl { display: flex; gap: 3px; font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.xl span { flex: 1; text-align: center; overflow: hidden; white-space: nowrap; }
.trunc { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-bottom: 10px; }
.sum div b { font-size: 20px; display: block; font-variant-numeric: tabular-nums; }
.sum div span { font-size: 12px; color: var(--muted); }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); max-width: 520px; width: calc(100% - 32px); padding: 18px 20px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 8px; max-width: min(640px, calc(100% - 32px)); font-size: 13px; display: none; z-index: 5; white-space: pre-wrap; }
pre { white-space: pre-wrap; font-size: 11.5px; color: var(--muted); margin: 6px 0 0; max-height: 160px; overflow: auto; }
.empty { color: var(--muted); padding: 12px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>quotaboard</h1>
    <span class="muted small" id="updated">loading…</span>
    <span id="sources"></span>
  </header>

  <h2 style="margin-top:4px">Quotas <span class="muted small" style="font-weight:400">— what is left; a fuller bar means more quota</span></h2>
  <div class="grid quotas" id="quotas"></div>
  <div class="note" id="unreadable"></div>

  <section class="card">
    <h2>Advice</h2>
    <div id="advice"></div>
  </section>

  <div class="tabs" id="tabs">
    <button data-t="spend" class="on">Spending</button>
    <button data-t="sessions">Sessions</button>
    <button data-t="runs" data-multica>Multica runs</button>
    <button data-t="agents" data-multica>Agents &amp; switches</button>
  </div>
  <div class="filters">
    <div class="seg" id="span">
      <button data-v="today" class="on">Today</button><button data-v="window">This window</button><button data-v="week">7 days</button>
    </div>
    <div id="kinds" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <input id="search" type="search" placeholder="Search: agent, issue, title…" style="flex:1;min-width:180px">
  </div>

  <div class="tab on" id="t-spend">
    <section class="grid g2">
      <div class="card"><h2>Who spent it</h2><div id="who"></div></div>
      <div class="card"><h2>Models</h2><div id="models"></div></div>
    </section>
    <section class="grid g2" data-multica>
      <div class="card"><h2>Multica agents</h2><div class="scroll" id="by_agent"></div></div>
      <div class="card"><h2>Multica issues</h2><div class="scroll" id="by_issue"></div></div>
    </section>
    <section class="grid g2">
      <div class="card"><h2>Daily <span class="muted small">(Claude, last 21 days)</span></h2><div id="daily"></div></div>
      <div class="card"><h2>5-hour windows <span class="muted small">(last 3 days)</span></h2><div id="windows"></div><h3>Weekly (Claude)</h3><div id="weekly"></div></div>
    </section>
  </div>

  <div class="tab" id="t-sessions"><section class="card"><div class="scroll" id="sessions"></div></section></div>

  <div class="tab" id="t-runs">
    <section class="card">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <div class="seg" id="rstatus"><button data-v="" class="on">All</button><button data-v="live">Running</button><button data-v="failed">Failed</button><button data-v="completed">Done</button></div>
        <select id="ragent"><option value="">All agents</option></select>
      </div>
      <div class="scroll" id="runs"></div>
    </section>
  </div>

  <div class="tab" id="t-agents">
    <section class="grid g2">
      <div class="card">
        <h2>Agent models</h2>
        <p class="muted small" style="margin-top:0" id="model_note"></p>
        <div class="scroll" id="agents"></div>
      </div>
      <div class="card"><h2>Stop switches</h2><div id="switches"></div></div>
    </section>
  </div>
</main>

<dialog id="confirm">
  <h2 id="confirm_title">Confirm</h2>
  <div id="confirm_text" style="margin-bottom:14px"></div>
  <div style="display:flex; gap:8px; justify-content:flex-end">
    <button id="confirm_no">Cancel</button>
    <button class="primary" id="confirm_yes">Confirm</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = x => x == null ? "–" : "$" + (x >= 100 ? Math.round(x).toLocaleString() : Number(x).toFixed(2));
const tok = x => x == null ? "–" : x >= 1e9 ? (x/1e9).toFixed(1) + "B" : x >= 1e6 ? (x/1e6).toFixed(1) + "M" : x >= 1e3 ? Math.round(x/1e3) + "k" : String(x);
const hm = s => s ? new Date(s).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "–";
const dayHm = s => s ? new Date(s).toLocaleString([], {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "–";
const ago = s => { if (!s) return ""; const m = Math.round((Date.now() - new Date(s)) / 60000); return m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const MVAR = m => m.includes("opus") ? "--m-opus" : m.includes("fable") ? "--m-fable" : m.includes("sonnet") ? "--m-sonnet" : m.includes("haiku") ? "--m-haiku" : "--m-other";
const MNAME = m => (m || "").replace("claude-", "").replace(/-(\d)-(\d)$/, " $1.$2");
const KIND = {long: "Long-running", multica: "Multica", scheduled: "Scheduled", interactive: "Interactive", side: "Side session"};
const KVAR = {long: "--k-long", multica: "--k-multica", scheduled: "--k-scheduled", side: "--k-side", interactive: "--k-interactive"};
const SPAN = {today: "today", window: "this window", week: "7 days"};

const F = {span: "today", kinds: Object.keys(KIND), search: "", tab: "spend", rstatus: "", ragent: "", sort: {}};
try { Object.assign(F, JSON.parse(localStorage.getItem("quotaboard") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("quotaboard", JSON.stringify(F)); } catch (e) {} };
let data = null, pending = null, editing = false, allAdvice = false;

function toast(msg, ms = 6000) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms);
}
function confirmBox(title, html, fn) { $("confirm_title").textContent = title; $("confirm_text").innerHTML = html; pending = fn; $("confirm").showModal(); }
$("confirm_no").onclick = () => { pending = null; $("confirm").close(); };
$("confirm_yes").onclick = async () => {
  const fn = pending; pending = null; $("confirm_yes").disabled = true;
  try { await fn(); } finally { $("confirm_yes").disabled = false; $("confirm").close(); }
};
async function act(path, body) {
  toast(path === "/api/model" ? "Applying… pushing to Multica can take a minute or two; keep the page open." : "Applying…", 300000);
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Quotaboard": TOKEN}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: "could not read the reply"}));
  toast(r.ok ? j.message + (j.output ? "\n\n" + j.output : "") : "Failed: " + j.error, 12000);
  load();
}
function confirmModel(a, model, thinking) {
  const o = a.model + (a.thinking ? " / " + a.thinking : ""), n = model + (thinking ? " / " + thinking : "");
  confirmBox("Change this agent's model?", `<b>${esc(a.name)}</b>: ${esc(o)} → <b>${esc(n)}</b><br><span class="muted small">${esc(modelNote())} A running run is not affected; the next run starts with the new model.</span>`,
    () => act("/api/model", {agent: a.name, model, thinking}));
}
function confirmCancel(run, label) {
  confirmBox("Cancel this run?", `<b>${esc(label)}</b><br><span class="muted small">multica issue cancel-task. The issue stays; it can be rerun.</span>`, () => act("/api/cancel", {run}));
}
function confirmSwitch(i, stop) {
  const d = data.stop_files[i];
  confirmBox(stop ? `Stop ${d.name}?` : `Start ${d.name}?`, `${esc(d.description || "")}<br><span class="muted small">${stop ? "Creates" : "Removes"} its stop file.</span>`, () => act("/api/stop-file", {i, stop}));
}
const modelNote = () => data?.model_action === "file" ? "The agent's file is rewritten, the push command sends it to Multica, and the file is committed." : "Runs multica agent update.";

// ---------- quotas ----------
function limitRow(name, left, text, reset, note) {
  const ok = left != null && !isNaN(left);
  const c = !ok ? "var(--muted)" : left <= 10 ? "var(--red)" : left <= 35 ? "var(--amber)" : "var(--green)";
  return `<div class="limit"><div class="top"><span>${esc(name)}</span><b style="color:${c}">${esc(text ?? (ok ? Math.round(left) + "% left" : "–"))}</b></div>
    <div class="bar">${ok ? `<span style="width:${Math.max(0, Math.min(100, left))}%;background:${c}"></span>` : ""}</div>
    ${reset || note ? `<div class="reset">${reset ? "resets " + esc(dayHm(reset)) : ""}${reset && note ? " · " : ""}${esc(note || "")}</div>` : ""}</div>`;
}
const LIM = s => /weekly/i.test(s) ? "weekly" : /five hour/i.test(s) ? "5-hour" : s;
function users(v, names) { const l = names.flatMap(n => v.runtimes[n]?.agents || []); return l.length ? l.join(", ") : ""; }
function byProvider(v, p) { return Object.entries(v.runtimes).filter(([, r]) => r.provider === p).map(([n]) => n); }
const usedBy = (v, names) => v.multica ? ` · Agents: ${users(v, names) || "none"}` : "";

function renderQuotas(v) {
  const q = v.quotas || {}, cards = [];
  const w = v.window, cl = q.claude || {}, m0 = cl.manual;
  const manual = m0 && ["five_hour", "weekly", "weekly_model"].some(k => m0[k] != null) ? m0 : null;
  let c = `<div class="card quota"><h2><span>Claude</span><span class="pill">${esc(cl.plan || "?")}</span></h2>
    <div class="sub">Claude Code sessions${usedBy(v, byProvider(v, "claude"))}</div>`;
  if (w && w.cap) c += limitRow("5-hour (estimate)", 100 - pct(w.usd, w.cap), null, w.end, w.full_before_end ? `full at ${hm(w.full_at)} at this pace` : `${usd(w.per_hour)} per hour`);
  else c += limitRow("5-hour (estimate)", 100, "no open window", null, "no Claude use in the last 5 hours");
  if (manual) {
    if (manual.five_hour != null) c += limitRow("5-hour (from the app)", 100 - manual.five_hour, null, null, "entered " + ago(manual.at));
    if (manual.weekly != null) c += limitRow("weekly (from the app)", 100 - manual.weekly, null, null, "entered " + ago(manual.at));
    if (manual.weekly_model != null) c += limitRow("weekly, model-specific (from the app)", 100 - manual.weekly_model, null, null, "entered " + ago(manual.at));
  } else c += limitRow("weekly", null, "not readable", null, "only shown in the Claude app; type it in below");
  c += `<details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Enter the app's used percentages</summary>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center" class="small">
      5-hour % <input type="number" min="0" max="100" id="cp_5" value="${manual?.five_hour ?? ""}">
      weekly % <input type="number" min="0" max="100" id="cp_w" value="${manual?.weekly ?? ""}">
      model weekly % <input type="number" min="0" max="100" id="cp_m" value="${manual?.weekly_model ?? ""}">
      <button id="cp_save">Save</button></div>
    <div class="muted small" style="margin-top:4px">The "used" numbers from the Claude app's usage settings. Kept only on this computer.</div></details></div>`;
  cards.push(c);
  for (const [name, a] of Object.entries(v.antigravity || {})) {
    let k = `<div class="card quota"><h2><span>Antigravity ${esc(name)}</span></h2><div class="sub">${esc(a.command)}${a.note ? " · " + esc(a.note) : ""}${usedBy(v, a.runtimes || [])}</div>`;
    if (a.error) k += `<div style="color:var(--red)" class="small">Not readable: ${esc(a.error)}</div>`;
    else for (const r of a.rows) {
      const n = parseInt(r.left), g = r.group.replace("Claude and GPT models", "Claude/GPT").replace("Gemini Models", "Gemini").replace("Gemini 4 Argon", "Argon");
      k += limitRow(`${g} · ${LIM(r.limit)}`, isNaN(n) ? null : n, isNaN(n) ? (r.left === "disabled" ? "off" : r.left) : null, r.reset);
    }
    cards.push(k + "</div>");
  }
  if (q.codex) {
    const x = q.codex;
    cards.push(`<div class="card quota"><h2><span>Codex</span><span class="pill">${esc(x.plan || "")}</span></h2>
      <div class="sub">${x.account ? "ChatGPT account " + esc(x.account) : ""}${usedBy(v, byProvider(v, "codex"))}</div>
      ${x.error ? `<div style="color:var(--red)" class="small">Not readable: ${esc(x.error)}</div>` : x.rows.map(r => limitRow(r.name, r.left, null, r.reset)).join("")}</div>`);
  }
  if (q.openrouter) {
    const x = q.openrouter;
    cards.push(`<div class="card quota"><h2><span>OpenRouter</span><span class="pill">${esc(x.plan || "")}</span></h2>
      <div class="sub">opencode's key · ${esc(x.usage || "")}${usedBy(v, byProvider(v, "opencode"))}</div>
      ${x.error ? `<div style="color:var(--red)" class="small">Not readable: ${esc(x.error)}</div>` : x.rows.map(r => limitRow(r.name, r.left, r.text, r.reset)).join("")}</div>`);
  }
  $("quotas").innerHTML = cards.join("");
  const inst = q.installed || {}, miss = [];
  if (inst.opencode) miss.push("OpenCode Zen (opencode's own provider)");
  if (inst.gemini) miss.push("Gemini CLI");
  $("unreadable").innerHTML = (miss.length ? `<b>Not readable:</b> ${esc(miss.join(" and "))} ${miss.length > 1 ? "do" : "does"} not expose quota. ` : "")
    + `The Claude percentage is an estimate: this window's $ spend ÷ a cap (${esc(w?.cap_source || "–")}, ${usd(w?.cap)}). The real value is in the Claude app.`
    + (inst.ccusage ? "" : ` <b>ccusage is not installed</b> (npm i -g ccusage); Claude spending stays empty.`);
  if ($("cp_save")) $("cp_save").onclick = () => act("/api/claude", {five_hour: $("cp_5").value, weekly: $("cp_w").value, weekly_model: $("cp_m").value});
}

// ---------- advice ----------
function renderAdvice(v) {
  const ag = Object.fromEntries(v.agents.map(a => [a.name, a]));
  const list = allAdvice ? v.advice : v.advice.slice(0, 5);
  $("advice").innerHTML = (v.advice.length ? list.map((o, i) => {
    let b = "";
    if (o.action?.type === "model") b = `<button data-o="${i}">Switch to ${esc(MNAME(o.action.model))}${ag[o.action.agent]?.provider === "claude" ? " / " + esc(o.action.thinking) : ""}</button>`;
    if (o.action?.type === "cancel") b = `<button class="danger" data-o="${i}">Cancel run</button>`;
    if (o.action?.type === "stop_file") b = `<button data-o="${i}">Start it</button>`;
    return `<div class="adv"><div class="lvl ${o.level}"></div><div><div>${esc(o.text)}</div><div class="why">${esc(o.why)}</div></div><div>${b}</div></div>`;
  }).join("") : `<div class="empty">Nothing to flag right now.</div>`)
    + (v.advice.length > 5 ? `<div style="margin-top:8px"><button class="link" id="adv_all">${allAdvice ? "Show less" : `Show all (${v.advice.length})`}</button></div>` : "");
  $("advice").querySelectorAll("button[data-o]").forEach(b => b.onclick = () => {
    const e = v.advice[+b.dataset.o].action;
    if (e.type === "model") confirmModel(ag[e.agent], e.model, ag[e.agent].provider === "claude" ? e.thinking : ag[e.agent].thinking);
    if (e.type === "cancel") confirmCancel(e.run, e.label);
    if (e.type === "stop_file") confirmSwitch(e.i, e.stop);
  });
  if ($("adv_all")) $("adv_all").onclick = () => { allAdvice = !allAdvice; renderAdvice(v); };
}

// ---------- filters ----------
const match = s => !F.search || String(s).toLowerCase().includes(F.search.toLowerCase());
const sessions = v => v.sessions.filter(r => F.kinds.includes(r.kind) && r[F.span] > 0.005
  && match([r.title, r.first_message, r.label, r.agent, r.issue, r.issue_title, r.project, r.id].join(" ")));
function renderFilters(v) {
  if (!v.multica && (F.tab === "runs" || F.tab === "agents")) F.tab = "spend";
  document.querySelectorAll("[data-multica]").forEach(el => el.style.display = v.multica ? "" : "none");
  $("span").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === F.span));
  const kinds = Object.keys(KIND).filter(k => v.multica || k !== "multica");
  $("kinds").innerHTML = kinds.map(k => `<button class="chip ${F.kinds.includes(k) ? "" : "off"}" data-k="${k}"><i class="dot" style="background:var(${KVAR[k]})"></i>${KIND[k]}</button>`).join("");
  $("kinds").querySelectorAll("button").forEach(b => b.onclick = () => {
    const k = b.dataset.k; F.kinds = F.kinds.includes(k) ? F.kinds.filter(x => x !== k) : [...F.kinds, k]; save(); draw();
  });
  $("search").value = F.search;
  $("tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === F.tab));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "t-" + F.tab));
  $("kinds").style.display = F.tab === "runs" || F.tab === "agents" ? "none" : "flex";
  $("span").style.display = F.tab === "agents" || F.tab === "runs" ? "none" : "";
}
$("span").querySelectorAll("button").forEach(b => b.onclick = () => { F.span = b.dataset.v; save(); draw(); });
$("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { F.tab = b.dataset.t; save(); draw(); });
$("search").oninput = e => { F.search = e.target.value; save(); draw(); };
$("rstatus").querySelectorAll("button").forEach(b => b.onclick = () => { F.rstatus = b.dataset.v; save(); draw(); });
$("ragent").onchange = e => { F.ragent = e.target.value; save(); draw(); };

function table(id, cols, rows, def, limit = 60) {
  const s = F.sort[id] || def, col = cols.find(k => k.k === s.k) || cols[0];
  const sorted = [...rows].sort((a, b) => { const x = col.v ? col.v(a) : a[col.k], y = col.v ? col.v(b) : b[col.k]; return (x > y ? 1 : x < y ? -1 : 0) * (s.dir || -1); });
  $(id).innerHTML = rows.length ? `<table><tr>${cols.map(k => `<th class="${k.r ? "r" : ""}" ${k.k ? `data-s="${k.k}"` : ""}>${esc(k.t)}${s.k === k.k ? (s.dir === 1 ? " ↑" : " ↓") : ""}</th>`).join("")}</tr>
    ${sorted.slice(0, limit).map(r => `<tr>${cols.map(k => `<td class="${k.r ? "r" : ""}">${k.h(r)}</td>`).join("")}</tr>`).join("")}</table>
    ${rows.length > limit ? `<div class="muted small" style="margin-top:6px">Showing ${limit} of ${rows.length}; search to narrow it down.</div>` : ""}`
    : `<div class="empty">Nothing matches these filters.</div>`;
  $(id).querySelectorAll("th[data-s]").forEach(th => th.onclick = () => { const k = th.dataset.s; F.sort[id] = {k, dir: s.k === k ? -(s.dir || -1) : -1}; save(); draw(); });
}

// ---------- spending ----------
function stack(parts) {
  const t = parts.reduce((a, p) => a + p.v, 0) || 1;
  return `<div class="stack">${parts.filter(p => p.v > 0).map(p => `<span title="${esc(p.n)}: ${usd(p.v)}" style="width:${100 * p.v / t}%;background:var(${p.c})"></span>`).join("")}</div>`;
}
const legend = parts => `<div class="legend">${parts.filter(p => p.v > 0).map(p => `<span><i class="dot" style="background:var(${p.c})"></i>${esc(p.n)} ${usd(p.v)}</span>`).join("")}</div>`;
const nameOf = r => r.title || (r.agent ? `${r.agent} · ${r.issue || "no issue"}${r.issue_title ? " — " + r.issue_title : ""}` : r.first_message) || r.id.slice(0, 8);
function bars(items, label, title) {
  const max = Math.max(1, ...items.map(x => x.total));
  return `<div class="chart">${items.map(x => `<div class="col" title="${esc(title(x))}" style="height:${100 * x.total / max}%">${x.parts.map(p => `<span style="height:${100 * p.v / (x.total || 1)}%;background:var(${p.c})"></span>`).join("")}</div>`).join("")}</div>
    <div class="xl">${items.map(x => `<span>${esc(label(x))}</span>`).join("")}</div>`;
}
function renderSpend(v) {
  const ss = sessions(v), f = F.span, w = v.window;
  const total = ss.reduce((a, r) => a + r[f], 0);
  const kinds = Object.keys(KIND).map(k => ({n: KIND[k], c: KVAR[k], v: ss.filter(r => r.kind === k).reduce((a, r) => a + r[f], 0)}));
  $("who").innerHTML = `<div class="sum"><div><b>${usd(total)}</b><span>${SPAN[f]} · filtered</span></div><div><b>${ss.length}</b><span>sessions</span></div>
      ${f === "today" ? `<div><b>${usd(v.today_ccusage)}</b><span>ccusage today (Claude)</span></div>` : ""}
      ${f === "window" && w ? `<div><b>${hm(w.start)}–${hm(w.end)}</b><span>open window</span></div>` : ""}</div>
    ${stack(kinds)}${legend(kinds)}<h3>Top spenders</h3>
    ${ss.slice().sort((a, b) => b[f] - a[f]).slice(0, 6).map(r => `<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0" class="small">
      <span class="trunc"><i class="dot" style="background:var(${KVAR[r.kind]})"></i>${esc(nameOf(r))}</span><b class="num">${usd(r[f])}</b></div>`).join("")}
    <div class="note small">Kinds: a transcript under a <code>multica-workspaces</code> folder is a Multica run (tied to its agent and issue by the run id in the folder name);
    a first message starting with <code>&lt;scheduled-task</code> is a scheduled task; a session started by another session is a side session; an interactive session open for more than 24 hours is long-running.</div>`;

  const md = f === "today" ? Object.entries(v.models_today).map(([m, x]) => ({n: MNAME(m), v: x.usd, c: MVAR(m)}))
    : f === "week" ? Object.entries(v.weekly.at(-1)?.models || {}).map(([m, x]) => ({n: MNAME(m), v: x, c: MVAR(m)}))
    : (w?.models || []).map(m => ({n: MNAME(m), v: 0, c: MVAR(m)}));
  md.sort((a, b) => b.v - a.v);
  const mt = md.reduce((a, x) => a + x.v, 0);
  $("models").innerHTML = f === "window"
    ? `<div class="muted small">Models in this window: ${md.map(m => `<i class="dot" style="background:var(${m.c})"></i>${esc(m.n)}`).join(" ")}. A per-model split exists only per day and per week.</div>`
    : `${stack(md)}<table style="margin-top:8px"><tr><th>Model</th><th class="r">$</th><th class="r">share</th></tr>
      ${md.map(m => `<tr><td><i class="dot" style="background:var(${m.c})"></i>${esc(m.n)}</td><td class="r">${usd(m.v)}</td><td class="r">${pct(m.v, mt)}%</td></tr>`).join("")}</table>
      <div class="muted small" style="margin-top:6px">${f === "week" ? "Calendar week. " : ""}Other tools today: ${tok(v.daily.at(-1)?.other_tokens)} tokens (not part of the Claude quota).</div>`;

  const mu = ss.filter(r => r.kind === "multica");
  const group = key => Object.values(mu.reduce((acc, r) => {
    const k = r[key] || "–", g = acc[k] ||= {name: k, usd: 0, sessions: 0, agents: new Set(), title: r.issue_title};
    g.usd += r[f]; g.sessions += 1; g.agents.add(r.agent); return acc; }, {}));
  table("by_agent", [{t: "Agent", k: "name", h: r => esc(r.name)}, {t: SPAN[f], k: "usd", r: 1, h: r => usd(r.usd)}, {t: "sessions", k: "sessions", r: 1, h: r => r.sessions}], group("agent"), {k: "usd"}, 20);
  table("by_issue", [
    {t: "Issue", k: "name", h: r => `<b>${esc(r.name)}</b> <span class="muted small">${esc(r.title || "")}</span><div class="muted small">${esc([...r.agents].join(", "))}</div>`},
    {t: SPAN[f], k: "usd", r: 1, h: r => usd(r.usd)}, {t: "sessions", k: "sessions", r: 1, h: r => r.sessions}], group("issue").filter(g => g.name !== "–"), {k: "usd"}, 15);

  const d = v.daily.map(x => ({...x, total: x.usd, parts: Object.entries(x.models).filter(([, c]) => c > 0).map(([m, c]) => ({v: c, c: MVAR(m), n: MNAME(m)}))}));
  const all = [...new Set(v.daily.flatMap(x => Object.keys(x.models).filter(m => x.models[m] > 0)))];
  $("daily").innerHTML = bars(d, x => x.day.slice(8), x => `${x.day}: ${usd(x.usd)}\n` + x.parts.map(p => `${p.n} ${usd(p.v)}`).join("\n"))
    + `<div class="legend">${all.map(m => `<span><i class="dot" style="background:var(${MVAR(m)})"></i>${esc(MNAME(m))}</span>`).join("")}</div>`;
  const ws = v.recent_windows.map(b => ({...b, total: b.usd, parts: [{v: b.usd, c: b.active ? "--red" : "--blue"}]}));
  $("windows").innerHTML = bars(ws, x => hm(x.start), x => `${dayHm(x.start)} – ${hm(x.end)}: ${usd(x.usd)}${x.active ? " (open)" : ""}`)
    + `<div class="muted small">Red: the open window. Estimated cap ${usd(w?.cap)}.</div>`;
  $("weekly").innerHTML = `<table><tr><th>Week of</th><th class="r">$</th><th class="r">tokens</th></tr>${v.weekly.slice(-4).reverse().map(x => `<tr><td>${esc(x.week)}</td><td class="r">${usd(x.usd)}</td><td class="r">${tok(x.tokens)}</td></tr>`).join("")}</table>`;
}

// ---------- sessions, runs, agents ----------
function renderSessions(v) {
  const f = F.span;
  table("sessions", [
    {t: "Session", k: "title", v: nameOf, h: r => `<div class="trunc" title="${esc(r.first_message)}">${esc(nameOf(r))}</div><div class="muted small">${esc(r.project)} · ${esc(r.id.slice(0, 8))}${r.model ? " · " + esc(MNAME(r.model)) : ""}</div>`},
    {t: "Kind", k: "kind", h: r => `<span class="pill"><i class="dot" style="background:var(${KVAR[r.kind]})"></i>${esc(KIND[r.kind])}</span>`},
    {t: SPAN[f], k: f, r: 1, h: r => `<b>${usd(r[f])}</b>`},
    ...(f === "week" ? [] : [{t: "7 days", k: "week", r: 1, h: r => usd(r.week)}]),
    {t: "context", k: "context", r: 1, h: r => `<span ${r.context > 400000 ? 'style="color:var(--red)"' : ""}>${tok(r.context)}</span>`},
    {t: "last", k: "last", r: 1, h: r => `<span class="muted small">${esc(dayHm(r.last))}</span>`},
  ], sessions(v), {k: f}, 60);
}
function renderRuns(v) {
  const ags = [...new Set(v.runs.map(r => r.agent))].sort();
  $("ragent").innerHTML = `<option value="">All agents</option>` + ags.map(a => `<option ${a === F.ragent ? "selected" : ""}>${esc(a)}</option>`).join("");
  $("rstatus").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === F.rstatus));
  const live = new Set(["queued", "dispatched", "running"]);
  const rows = v.runs.filter(r => (!F.ragent || r.agent === F.ragent) && (!F.rstatus || (F.rstatus === "live" ? live.has(r.status) : r.status === F.rstatus))
    && match([r.agent, r.issue_key, r.issue_title, r.model, r.reason].join(" ")))
    .map(r => ({...r, mins: live.has(r.status) ? (v.live.find(c => c.task_id === r.task_id)?.running_minutes ?? 0) : +r.minutes || 0}));
  const ST = {completed: "done", failed: "failed", cancelled: "cancelled", queued: "queued", dispatched: "starting", running: "running"};
  table("runs", [
    {t: "Agent · issue", k: "agent", h: r => `${esc(r.agent)} · <b>${esc(r.issue_key || "no issue")}</b><div class="muted small trunc">${esc(r.issue_title)}</div>`},
    {t: "Model", k: "model", h: r => `<span class="small" style="white-space:nowrap">${esc(MNAME(r.model))}</span>`},
    {t: "Status", k: "status", h: r => `<span class="small" ${r.status === "failed" ? 'style="color:var(--red)"' : ""}>${esc(ST[r.status] || r.status)}${r.status === "failed" ? ": " + esc((r.reason || "").split(".").pop()) : ""}</span>`},
    {t: "started", k: "created", r: 1, h: r => `<span class="muted small">${esc(dayHm(r.created))}</span>`},
    {t: "min", k: "mins", r: 1, h: r => r.mins || "–"},
    {t: "tokens", k: "tokens", r: 1, h: r => tok(r.tokens)},
    {t: "", h: r => live.has(r.status) ? `<button class="danger" data-k="${esc(r.task_id)}" data-e="${esc(r.agent + " · " + (r.issue_key || ""))}">Cancel</button>` : ""},
  ], rows, F.rstatus === "live" ? {k: "mins"} : {k: "tokens"}, 60);
  $("runs").querySelectorAll("button[data-k]").forEach(b => b.onclick = () => confirmCancel(b.dataset.k, b.dataset.e));
}
function renderAgents(v) {
  const o = v.options, list = v.agents.filter(a => match([a.name, a.model, a.runtime].join(" ")));
  $("model_note").textContent = modelNote() + " To undo, pick the old value and apply again.";
  $("agents").innerHTML = list.length ? `<table><tr><th>Agent</th><th>Runtime</th><th>Model</th><th>Thinking</th><th></th></tr>
    ${list.map(a => {
      const i = v.agents.indexOf(a), claude = a.provider === "claude", mods = claude ? o.claude : [...new Set([a.model, ...o.other])];
      return `<tr><td>${esc(a.name)}</td><td class="small muted">${esc(a.runtime)}</td>
        <td><select data-i="${i}" data-f="model">${mods.map(m => `<option ${m === a.model ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></td>
        <td>${claude ? `<select data-i="${i}" data-f="thinking">${o.thinking.map(m => `<option ${m === a.thinking ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>` : `<span class="muted small">in the model name</span>`}</td>
        <td><button data-i="${i}" disabled>Apply</button></td></tr>`;
    }).join("")}</table>` : `<div class="empty">No agents.</div>`;
  const root = $("agents");
  const pick = i => [root.querySelector(`select[data-i="${i}"][data-f="model"]`).value, root.querySelector(`select[data-i="${i}"][data-f="thinking"]`)?.value ?? v.agents[i].thinking];
  root.querySelectorAll("select").forEach(el => el.onchange = () => {
    const i = el.dataset.i, a = v.agents[i], [m, t] = pick(i);
    root.querySelector(`button[data-i="${i}"]`).disabled = m === a.model && t === a.thinking; editing = true;
  });
  root.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { const [m, t] = pick(b.dataset.i); editing = false; confirmModel(v.agents[b.dataset.i], m, t); });
  $("switches").innerHTML = v.stop_files.length ? v.stop_files.map((d, i) => `<div style="margin-bottom:14px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${esc(d.name)}</b>
      <span class="pill" style="color:${d.stopped ? "var(--red)" : "var(--green)"}">${d.stopped ? "stopped " + dayHm(d.since) : "running"}</span>
      <button data-sw="${i}" class="${d.stopped ? "" : "danger"}">${d.stopped ? "Start" : "Stop"}</button></div>
      <div class="muted small">${esc(d.description)}</div>${d.log.length ? `<pre>${esc(d.log.join("\n"))}</pre>` : ""}</div>`).join("")
    : `<div class="empty">None configured. Add <code>stop_files</code> to the config to pause a watchdog or scheduler from here.</div>`;
  $("switches").querySelectorAll("button[data-sw]").forEach(b => b.onclick = () => confirmSwitch(+b.dataset.sw, !v.stop_files[+b.dataset.sw].stopped));
}
function renderSources(v) {
  const N = {blocks: "window", daily: "daily", scan: "sessions", quotas: "quotas", antigravity: "Antigravity", multica: "Multica", issues: "issues", agents: "agents", stop_files: "switches"};
  const keys = Object.keys(N).filter(k => k in v.sources || (k === "antigravity" && Object.keys(v.antigravity).length) || (["multica", "issues", "agents"].includes(k) && v.multica) || ["blocks", "daily", "scan", "quotas"].includes(k));
  const bad = keys.filter(k => v.sources[k] && !v.sources[k].ok), wait = keys.filter(k => !v.sources[k]);
  $("updated").textContent = "updated " + hm(v.now);
  $("sources").innerHTML = bad.length ? bad.map(k => `<span class="pill" style="color:var(--red)" title="${esc(v.sources[k].error)}">${N[k]}: not readable</span>`).join(" ")
    : wait.length ? `<span class="pill">collecting: ${wait.map(k => N[k]).join(", ")}</span>`
    : `<span class="pill" title="${esc(keys.map(k => N[k] + " " + hm(v.sources[k].at)).join("\n"))}">all sources fresh</span>`;
}

function draw() {
  if (!data) return;
  renderFilters(data);
  for (const f of [renderSpend, renderSessions, renderRuns]) { try { f(data); } catch (e) { console.error(f.name, e); } }
  if (!editing) try { renderAgents(data); } catch (e) { console.error(e); }
}
async function load() {
  try { data = await (await fetch("/api/data", {cache: "no-store"})).json(); }
  catch (e) { $("updated").textContent = "server unreachable (is quotaboard running?)"; return; }
  renderSources(data);
  for (const f of [renderQuotas, renderAdvice]) { try { f(data); } catch (e) { console.error(f.name, e); } }
  draw();
}
load();
setInterval(() => { if (!$("confirm").open && document.activeElement?.tagName !== "INPUT") load(); }, 30000);
</script>
</body>
</html>
