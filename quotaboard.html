<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>quotaboard</title>
<style>
/* World: a strip-chart recorder's paper. Engineering grid, black ink for what happened, dashed ink for what will,
   red pen for limits. Readouts are measurement, so they are set in mono; everything else is a plain sans. */
:root {
  --paper: #f6f4ec; --paper-2: #efece2; --sheet: #fbfaf5;
  --grid-1: rgba(48, 104, 92, .075); --grid-2: rgba(48, 104, 92, .15);
  --ink: #1b1c1a; --ink-2: #45473f; --ink-3: #66675f; --rule: #d9d5c7; --rule-2: #c9c4b3;
  --pen-red: #c2382c; --pen-blue: #23559c; --amber: #a86a00; --green: #2c7148;
  --wash-red: rgba(194, 56, 44, .08); --wash-blue: rgba(35, 85, 156, .08); --band: rgba(27, 28, 26, .035);
  --k-multica: #2a78d6; --k-long: #eb6834; --k-interactive: #1baf7a; --k-scheduled: #eda100; --k-side: #e87ba4;
  --m-sonnet: #2a78d6; --m-opus: #6250d6; --m-fable: #e34948; --m-haiku: #1baf7a; --m-other: #8d8b80;
  --t-input: #2a78d6; --t-output: #eb6834; --t-write: #1baf7a; --t-read: #eda100;
  --heat-0: #eef1f6; --heat-1: #cfdcf0; --heat-2: #9fbde6; --heat-3: #5f95d8; --heat-4: #2a6bc4; --heat-5: #1a4a8f;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --paper: #121412; --paper-2: #181a17; --sheet: #161815;
    --grid-1: rgba(150, 205, 185, .045); --grid-2: rgba(150, 205, 185, .09);
    --ink: #ebeae3; --ink-2: #c4c3b9; --ink-3: #9d9c92; --rule: #2c2f2a; --rule-2: #3a3d37;
    --pen-red: #ef6b5d; --pen-blue: #79a7ec; --amber: #e0a73c; --green: #63b98a;
    --wash-red: rgba(239, 107, 93, .1); --wash-blue: rgba(121, 167, 236, .1); --band: rgba(235, 234, 227, .035);
    --k-multica: #3987e5; --k-long: #d95926; --k-interactive: #199e70; --k-scheduled: #c98500; --k-side: #d55181;
    --m-sonnet: #3987e5; --m-opus: #9085e9; --m-fable: #e66767; --m-haiku: #199e70; --m-other: #77756d;
    --t-input: #3987e5; --t-output: #d95926; --t-write: #199e70; --t-read: #c98500;
    --heat-0: #1b2029; --heat-1: #1f3250; --heat-2: #24497a; --heat-3: #2f64a8; --heat-4: #4a86d4; --heat-5: #8db6ef;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121412; --paper-2: #181a17; --sheet: #161815;
  --grid-1: rgba(150, 205, 185, .045); --grid-2: rgba(150, 205, 185, .09);
  --ink: #ebeae3; --ink-2: #c4c3b9; --ink-3: #9d9c92; --rule: #2c2f2a; --rule-2: #3a3d37;
  --pen-red: #ef6b5d; --pen-blue: #79a7ec; --amber: #e0a73c; --green: #63b98a;
  --wash-red: rgba(239, 107, 93, .1); --wash-blue: rgba(121, 167, 236, .1); --band: rgba(235, 234, 227, .035);
  --k-multica: #3987e5; --k-long: #d95926; --k-interactive: #199e70; --k-scheduled: #c98500; --k-side: #d55181;
  --m-sonnet: #3987e5; --m-opus: #9085e9; --m-fable: #e66767; --m-haiku: #199e70; --m-other: #77756d;
  --t-input: #3987e5; --t-output: #d95926; --t-write: #199e70; --t-read: #c98500;
  --heat-0: #1b2029; --heat-1: #1f3250; --heat-2: #24497a; --heat-3: #2f64a8; --heat-4: #4a86d4; --heat-5: #8db6ef;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; caret-color: var(--pen-blue); }
::selection { background: var(--wash-blue); color: var(--ink); }
:focus-visible { outline: 2px solid var(--pen-blue); outline-offset: 2px; border-radius: 3px; }
* { scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
a { color: var(--pen-blue); text-underline-offset: 3px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 12px; }
button, select, input { font: inherit; color: inherit; }

/* top strip */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.top-in { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 18px; }
.mark { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -0.01em; font-size: 15px; }
.mark svg { display: block; }
.rec { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-3); }
.rec i { width: 7px; height: 7px; border-radius: 50%; background: var(--pen-red); }
.top .spacer { flex: 1; }
.health { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; cursor: default; }
.health.bad { color: var(--pen-red); }
.lang { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; }
.lang button { border: 0; background: none; padding: 3px 9px; font-size: 12px; font-family: var(--mono); color: var(--ink-3); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

main { max-width: 1320px; margin: 0 auto; padding: 22px 20px 80px; }
h2 { font-size: 13px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; margin: 0; color: var(--ink); }
h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--ink); }
.section-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 0 0 10px; }
.section-head .note { font-size: 12.5px; color: var(--ink-3); }

/* the recorder: the page's one sheet of chart paper */
.sheet { position: relative; background-color: var(--sheet); border: 1px solid var(--rule-2); border-radius: 4px;
  background-image: linear-gradient(var(--grid-2) 1px, transparent 1px), linear-gradient(90deg, var(--grid-2) 1px, transparent 1px),
    linear-gradient(var(--grid-1) 1px, transparent 1px), linear-gradient(90deg, var(--grid-1) 1px, transparent 1px);
  background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px; background-position: -1px -1px; }
#recorder { display: block; width: 100%; user-select: none; }
#recorder text { font-family: var(--sans); fill: var(--ink-2); }
#recorder .mono { font-family: var(--mono); }
.rec-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 14px 10px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-3); background: var(--sheet); border-radius: 0 0 4px 4px; }
.rec-legend span { display: inline-flex; align-items: center; gap: 7px; }
.key-line { width: 18px; height: 0; border-top: 2px solid var(--ink); display: inline-block; }
.key-dash { border-top-style: dashed; }
.key-red { border-top-color: var(--pen-red); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.45; min-width: 170px; box-shadow: 0 6px 20px -6px rgba(0,0,0,.35); opacity: 0; transition: opacity .12s; z-index: 4; }
.tip.on { opacity: 1; }
.tip b { font-family: var(--mono); font-weight: 600; }
.tip .row { display: flex; justify-content: space-between; gap: 14px; }
.tip .row span:first-child { opacity: .75; }

/* claude percentages entry */
.app-entry { position: absolute; z-index: 5; background: var(--sheet); border: 0; border-radius: 8px; padding: 12px 14px; width: 300px; box-shadow: 0 12px 32px -12px rgba(0,0,0,.3); display: none; }
.app-entry.on { display: block; }
.app-entry label { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; margin: 6px 0; }
.app-entry input { width: 74px; text-align: right; font-family: var(--mono); border: 1px solid var(--rule-2); border-radius: 5px; padding: 4px 6px; background: var(--paper); }
.app-entry p { font-size: 12px; color: var(--ink-3); margin: 8px 0 10px; }

/* notes + summary */
.below { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 28px; margin-top: 26px; }
@media (max-width: 980px) { .below { grid-template-columns: 1fr; } }
.notes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.notes li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 12px; padding: 11px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.notes .lv { margin-top: 3px; }
.notes .t { font-weight: 550; }
.notes .w { grid-column: 2; font-size: 12.5px; color: var(--ink-3); }
.notes .act { grid-row: 1 / span 2; grid-column: 3; align-self: center; }
.more { margin-top: 8px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.fact { padding: 12px 0 12px; border-bottom: 1px solid var(--rule); }
.fact:nth-child(odd) { padding-right: 16px; border-right: 1px solid var(--rule); }
.fact:nth-child(even) { padding-left: 16px; }
.fact .v { font-family: var(--mono); font-size: 24px; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.fact .l { font-size: 12px; color: var(--ink-3); }
.fact .d { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

/* buttons */
.btn { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 6px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.danger { color: var(--pen-red); border-color: color-mix(in srgb, var(--pen-red) 55%, transparent); }
.btn.danger:hover { background: var(--wash-red); }
.btn:disabled { opacity: .4; cursor: default; }
.link { border: 0; background: none; padding: 0; color: var(--pen-blue); cursor: pointer; font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; }

/* analysis */
.analysis { margin-top: 40px; }
.bar-controls { position: sticky; top: 47px; z-index: 6; background: var(--paper); border-bottom: 1px solid var(--rule); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.tabs { display: flex; gap: 2px; }
.tabs button { border: 0; background: none; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-3); border-radius: 6px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule-2); }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 11px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule-2); background: none; border-radius: 20px; padding: 2px 10px 2px 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] .sw { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.search { flex: 1; min-width: 200px; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
.search::placeholder { color: var(--ink-3); }
.panel { display: none; padding-top: 22px; }
.panel.on { display: block; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 34px 40px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 40px; }
@media (max-width: 980px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.block { min-width: 0; }
.block + .block { }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin-bottom: 12px; }
.block-head h3 { margin: 0; }
.block-head .aside { font-size: 12px; color: var(--ink-3); }
.insight { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; max-width: 62ch; }
.insight b { color: var(--ink); font-weight: 600; }

/* ranked bar lists */
.ranks { display: grid; gap: 7px; }
.rank { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 3px 12px; align-items: center; }
.rank .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .name small { color: var(--ink-3); margin-left: 6px; }
.rank .val { text-align: right; font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.rank .track { grid-column: 1 / -1; height: 6px; background: var(--paper-2); border-radius: 3px; overflow: hidden; display: flex; gap: 2px; }
.rank .track span { height: 100%; border-radius: 0 3px 3px 0; }
.stackbar { display: flex; height: 14px; gap: 2px; border-radius: 3px; overflow: hidden; }
.stackbar span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { font-family: var(--mono); font-weight: 500; color: var(--ink); }

svg.chart { display: block; width: 100%; overflow: visible; }
svg.chart text { font-family: var(--sans); font-size: 11px; fill: var(--ink-3); }
svg.chart .axis { stroke: var(--rule-2); stroke-width: 1; }
svg.chart .gl { stroke: var(--rule); stroke-width: 1; }
.chart-wrap { position: relative; }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-3); padding: 7px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
th[data-s] { cursor: pointer; } th[data-s]:hover { color: var(--ink); }
th.r, td.r { text-align: right; }
td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.r { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:hover td { background: var(--band); }
.cell-title { max-width: 440px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-sub { font-size: 12px; color: var(--ink-3); }
.inline-bar { height: 4px; background: var(--paper-2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.inline-bar span { display: block; height: 100%; background: var(--ink-2); border-radius: 2px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.status-failed { color: var(--pen-red); }
.status-running { color: var(--pen-blue); }
.table-foot { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.empty { color: var(--ink-3); padding: 18px 0; font-size: 13px; }
select.sel { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; max-width: 220px; }

.counts { display: flex; flex-wrap: wrap; gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 24px; }
.counts > div { padding: 10px 22px 10px 0; margin-right: 22px; border-right: 1px solid var(--rule); }
.counts > div:last-child { border-right: 0; }
.counts .v { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.counts .l { font-size: 12px; color: var(--ink-3); }

pre.log { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: pre-wrap; margin: 8px 0 0; max-height: 180px; overflow: auto; border-left: 1px solid var(--rule-2); padding-left: 10px; }
.switch { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.fb-row { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(0, 3fr) auto; gap: 8px 18px; padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: center; }
@media (max-width: 860px) { .fb-row { grid-template-columns: 1fr; } }
.fb-name b { display: block; }
.fb-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fb-step { display: inline-flex; flex-direction: column; border: 1px solid var(--rule-2); border-radius: 6px; padding: 4px 9px; font-size: 12px; line-height: 1.35; background: var(--sheet); min-width: 0; }
.fb-step .m { font-family: var(--mono); font-size: 12px; color: var(--ink); }
.fb-step .r { color: var(--ink-3); font-size: 11.5px; }
.fb-step.cur { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.fb-step.closed .m { text-decoration: line-through; text-decoration-color: var(--pen-red); }
.fb-step .st { font-size: 11px; }
.fb-arrow { color: var(--ink-3); font-size: 12px; }
.fb-acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.fb-edit { display: grid; gap: 6px; margin-top: 8px; }
.fb-edit-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.fb-edit-row input { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 6px; padding: 4px 8px; font-family: var(--mono); font-size: 12px; width: 230px; }
.icon-btn { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 5px; width: 26px; height: 26px; cursor: pointer; display: inline-grid; place-items: center; padding: 0; }
.icon-btn:hover { border-color: var(--ink-3); }
.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; }
.events time { font-family: var(--mono); color: var(--ink-3); font-size: 12px; }
.switch-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

dialog { border: 0; border-radius: 10px; background: var(--sheet); color: var(--ink); max-width: 500px; width: calc(100% - 32px); padding: 20px 22px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.4); }
dialog::backdrop { background: rgba(10, 12, 10, .35); }
dialog h3 { font-size: 16px; margin-bottom: 8px; }
.dlg-text { font-size: 13.5px; margin-bottom: 18px; }
.dlg-text .sub { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 12px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; max-width: min(620px, calc(100% - 32px)); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s cubic-bezier(.2,.8,.2,1); z-index: 20; white-space: pre-wrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 720px) {
  .top-in, main { padding-left: 16px; padding-right: 16px; }
  .health .htext, .rec span { display: none; }
  .top-in { gap: 12px; }
  .facts { grid-template-columns: 1fr; }
  .fact:nth-child(odd) { border-right: 0; padding-right: 0; }
  .fact:nth-child(even) { padding-left: 0; }
  .bar-controls { position: static; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 15 L8 12 L11 13.5 L14 8 L18 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 5.5 H18" stroke="var(--pen-red)" stroke-width="1.4" stroke-dasharray="2 2"/></svg>
      quotaboard
    </div>
    <span class="rec"><i></i><span id="updated">…</span></span>
    <span class="spacer"></span>
    <span class="health" id="health"></span>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button><button data-lang="tr" aria-pressed="false">TR</button>
    </div>
  </div>
</header>

<main>
  <div class="section-head"><h2 data-i="recorder"></h2><span class="note" id="rec_note"></span></div>
  <div class="sheet" id="sheet">
    <svg id="recorder" role="img"></svg>
    <div class="tip" id="rec_tip"></div>
    <div class="app-entry" id="app_entry"></div>
    <div class="rec-legend" id="rec_legend"></div>
  </div>

  <div class="below">
    <section>

function lanes(v) {

  L.push({id: "claude", group: "Claude", sub: q.claude?.plan || "", claude: true});
  for (const [name, a] of Object.entries(v.antigravity || {})) {
    if (a.error) { L.push({group: "Antigravity " + name, sub: a.error, error: true}); continue; }
    for (const r of a.rows) {
      const w = /weekly/i.test(r.limit) ? "weekly" : /five hour/i.test(r.limit) ? "5h" : r.limit;
      const n = parseFloat(r.left);
      L.push({group: "Antigravity " + name, sub: `${GROUP(r.group)} · ${WIN(w)}`, left: isNaN(n) ? null : n, off: isNaN(n), reset: r.reset,
        pts: series(`agy|${name}|${r.group}|${w}`), agents: (a.runtimes || []).flatMap(rt => v.runtimes[rt]?.agents || []), note: a.note});
    }
  }
  if (q.codex && !q.codex.error) for (const r of q.codex.rows) L.push({group: "Codex", sub: `${q.codex.plan || ""} · ${WIN(r.window)}`, left: r.left, reset: r.reset, pts: series(`codex|${r.window}`)});

function claudeTrace(v) {

    let cum = 0; const pts = [[s, 0]];

      pts.push([Math.min(h + 3600e3, end), cum]);

    out.push({start: s, close, end, active: w.active, usd: w.usd, pts});

    if (ln.error) { txt(g, px0, mid + 4, ln.sub, {"font-size": 11.5, fill: cssv("--pen-red")}); return; }
    el("line", {x1: px0, x2: px1, y1: ly(0), y2: ly(0), stroke: cssv("--pen-red"), "stroke-width": 1, opacity: .22}, g);
    if (ln.off) { if (!narrow) txt(g, px0 + 4, mid + 4, t("status_off"), {"font-size": 11, fill: cssv("--ink-3")}); readout(narrow ? top + 33 : mid, t("status_off"), "", "off"); return; }
    const pts = [...(ln.pts || [])].filter(p => p[0] >= t0 - 6 * 3600e3);
    if (!pts.length || now - pts.at(-1)[0] > 60e3) pts.push([now, ln.left]);
    // step trace: a reading holds until the next one
    let d = "";
    pts.forEach((p, k) => { const px = x(p[0]), py = ly(p[1]); d += k ? `H${px.toFixed(1)}V${py.toFixed(1)}` : `M${px.toFixed(1)} ${py.toFixed(1)}`; });
    d += `H${x(now).toFixed(1)}`;
    el("path", {d, fill: "none", stroke: cssv("--ink"), "stroke-width": 2, "stroke-linejoin": "round", class: "ink"}, g);
    el("circle", {cx: x(now), cy: ly(ln.left), r: 4, fill: cssv("--ink"), stroke: cssv("--sheet"), "stroke-width": 2}, g);
    // pace from the readings of the last 3 hours, if it is falling
    const recent = pts.filter(p => p[0] >= now - 3 * 3600e3);
    let emptyAt = null;
    const reset = ln.reset ? new Date(ln.reset).getTime() : null;
    // only a real trend: readings at least 30 minutes apart that fell by 2 points or more
    if (recent.length >= 2 && recent.at(-1)[0] - recent[0][0] >= 30 * 60e3 && recent[0][1] - recent.at(-1)[1] >= 2) {
      const slope = (recent.at(-1)[1] - recent[0][1]) / (recent.at(-1)[0] - recent[0][0]);
      emptyAt = now + ln.left / -slope;
      const stop = Math.min(emptyAt, reset || Infinity, t1);
      el("path", {d: `M${x(now)} ${ly(ln.left)} L${x(stop)} ${ly(Math.max(0, ln.left + slope * (stop - now)))}`, stroke: emptyAt < (reset || Infinity) ? cssv("--pen-red") : cssv("--ink-2"), "stroke-width": 1.5, "stroke-dasharray": "5 4", fill: "none"}, g);
    }
    if (reset && reset <= t1) {
      const rx = x(reset);
      el("path", {d: `M${rx} ${ly1 + 2} V${ly0 - 2} l6 3 l-6 3`, stroke: cssv("--pen-red"), "stroke-width": 1.4, fill: cssv("--pen-red")}, g);
      el("path", {d: `M${rx} ${ly(ln.left)} H${rx} V${ly(100)} H${Math.min(px1, rx + 40)}`, stroke: cssv("--ink-3"), "stroke-width": 1.2, "stroke-dasharray": "2 3", fill: "none"}, g);
    } else if (reset && !narrow) txt(g, px1, ly0 + 2, `→ ${dayHm(ln.reset)}`, {"text-anchor": "end", "font-size": 10.5, fill: cssv("--ink-3")});
    const st = statusOf(ln.left);
    const small = emptyAt && emptyAt < (reset || Infinity) && emptyAt < now + 7 * 864e5 ? t("empty_at", {t: when(new Date(emptyAt))}) : reset ? t("resets_in", {d: until(ln.reset)}) : t("no_reset");
    readout(narrow ? top + 33 : mid, `${pc(ln.left)} ${t("left")}`, small, st);
    laneFns.push({name: `${ln.group} · ${ln.sub}`, at: tm => { let val = null; for (const p of pts) { if (p[0] <= tm) val = p[1]; } return tm > now ? null : val; }, fmt: val => pc(val)});
  });

  // now
  el("line", {x1: x(now), x2: x(now), y1: PADT - 8, y2: H - 22, stroke: cssv("--pen-blue"), "stroke-width": 1.5}, g);
  txt(g, x(now), PADT - 12, t("rec_now"), {"text-anchor": "middle", "font-size": 10.5, fill: cssv("--pen-blue"), "font-weight": 600});

  // first draw: the pen writes the ink in
  if (!drawnOnce && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    svg.querySelectorAll("path.ink").forEach(p => { const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.getBoundingClientRect(); p.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)"; p.style.strokeDashoffset = 0; setTimeout(() => { p.style.strokeDasharray = ""; p.style.transition = ""; }, 1200); });
    drawnOnce = true;
  }

  // crosshair
  const cross = el("line", {y1: PADT - 6, y2: H - 22, stroke: cssv("--ink-2"), "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden"}, svg);
  const hit = el("rect", {x: px0, y: 0, width: px1 - px0, height: H, fill: "transparent"}, svg);
  const tip = $("rec_tip");
  const cum = tm => { for (const tr of traces) if (tm >= tr.start && tm <= Math.max(tr.end, tr.start)) { let val = 0; for (const p of tr.pts) if (p[0] <= tm) val = p[1]; return val; } return null; };
  hit.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * (W / r.width);
    const tm = t0 + (mx - px0) / (px1 - px0) * (t1 - t0);
    cross.setAttribute("x1", mx); cross.setAttribute("x2", mx); cross.setAttribute("visibility", "visible");
    const c = cum(tm);
    const rows = [[`Claude ${t("used")}`, c != null && tm <= now ? usd(c) : "–"], ...laneFns.map(f => { const val = f.at(tm); return [f.name, val == null ? "–" : f.fmt(val)]; })];
    tip.innerHTML = `<div style="margin-bottom:4px"><b>${esc(dayHm(new Date(tm)))}</b></div>` + rows.map(([a, b]) => `<div class="row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join("");
    const tw = tip.offsetWidth || 220, left = (e.clientX - r.left) + 14;
    tip.style.left = (left + tw > r.width ? left - tw - 28 : left) + "px"; tip.style.top = "36px"; tip.classList.add("on");
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); tip.classList.remove("on"); });

  $("rec_legend").innerHTML = `<span><i class="key-line"></i>${esc(t("lg_ink"))}</span><span><i class="key-line key-dash"></i>${esc(t("lg_pace"))}</span><span><i class="key-line key-red"></i>${esc(t("lg_cap"))}</span>
    <span><svg width="10" height="12" aria-hidden="true"><path d="M1 11 V1 l6 3 l-6 3" stroke="var(--pen-red)" fill="var(--pen-red)" stroke-width="1.3"/></svg>${esc(t("lg_reset"))}</span>`;
}

// ---------- notes and today ----------
function renderNotes(v) {

  const fmt = (rule, p) => {
    const P = {...p};
    for (const k of ["usd", "total", "cap", "per_hour"]) if (P[k] != null) P[k] = usd(P[k]);
    if (P.context != null) P.context = tok(P.context);
    for (const k of ["at", "end"]) if (P[k]) P[k] = hm(P[k]);
    if (P.reset) P.reset = dayHm(P.reset);
    if (rule === "on_fallback") { P.since = P.since ? when(P.since) : "?"; P.back = P.back ? t("fb_back", {t: when(P.back)}) : t("fb_back_manual"); }
    if (P.window) P.window = WIN(P.window);
    if (P.group) P.group = GROUP(P.group);
    if (Array.isArray(P.allowed)) P.allowed = P.allowed.join(", ");
    if (Array.isArray(P.reasons)) P.reasons = P.reasons.join(", ");
    if (rule === "agy_empty") P.agents = P.agents?.length ? (I18N[LANG].adv.agy_empty_agents || I18N.en.adv.agy_empty_agents).replace("{a}", P.agents.join(", ")) : "";
    if (!P.issue) P.issue = t("no_issue");
    const tpl = (I18N[LANG].adv[rule] || I18N.en.adv[rule] || [rule, ""]);
    return tpl.map(s => s.replace(/\{(\w+)\}/g, (_, x) => P[x] ?? ""));
  };
  const list = allNotes ? v.advice : v.advice.slice(0, 6);
  $("notes").innerHTML = v.advice.length ? list.map((o, i) => {
    const [a, b] = fmt(o.rule, o.p);
    let btn = "";
    if (o.action?.type === "model") btn = `<button class="btn" data-o="${i}">${esc(t("switch_to", {m: MNAME(o.action.model) + (ag[o.action.agent]?.provider === "claude" ? " / " + o.action.thinking : "")}))}</button>`;
    if (o.action?.type === "cancel") btn = `<button class="btn danger" data-o="${i}">${esc(t("cancel_run_long"))}</button>`;
    if (o.action?.type === "stop_file") btn = `<button class="btn" data-o="${i}">${esc(t("start_it"))}</button>`;
    if (o.action?.type === "restore") btn = `<button class="btn" data-o="${i}">${esc(t("restore"))}</button>`;
    if (o.action?.type === "switch") btn = `<button class="btn" data-o="${i}">${esc(t("move_now", {x: o.action.target}))}</button>`;
    return `<li>${levelIcon(o.level)}<div class="t">${esc(a)}</div><div class="act">${btn}</div><div class="w">${esc(b)}</div></li>`;
  }).join("") : `<li><span></span><div class="muted">${esc(t("nothing"))}</div></li>`;
  $("notes_more").innerHTML = v.advice.length > 6 ? `<button class="link" id="notes_all">${esc(allNotes ? t("show_less") : t("show_all", {n: v.advice.length}))}</button>` : "";
  if ($("notes_all")) $("notes_all").onclick = () => { allNotes = !allNotes; renderNotes(v); };
  $("notes").querySelectorAll("button[data-o]").forEach(b => b.onclick = () => {
    const e = v.advice[+b.dataset.o].action;
    if (e.type === "model") confirmModel(ag[e.agent], e.model, ag[e.agent].provider === "claude" ? e.thinking : ag[e.agent].thinking);
    if (e.type === "cancel") confirmCancel(e.run, e.label);
    if (e.type === "stop_file") confirmSwitch(e.i, e.stop);
    if (e.type === "restore") confirmRestore(e.agent_id, e.agent);
    if (e.type === "switch") confirmFbSwitch(e.agent_id, e.agent, e.n, e.target);
  });
}

// ---------- generic pieces ----------
function ranks(id, items, {color = () => "--ink-2", sub = () => "", fmt = usd, limit = 8} = {}) {
  const max = Math.max(1e-9, ...items.map(i => i.v));
  const shown = items.slice(0, limit), rest = items.slice(limit);
  if (rest.length) shown.push({n: t("other") + ` (${rest.length})`, v: rest.reduce((a, i) => a + i.v, 0), other: true});
  $(id).innerHTML = items.length ? `<div class="ranks">${shown.map(i => `<div class="rank" title="${esc(i.n)}"><div class="name">${esc(i.n)}${sub(i) ? `<small>${esc(sub(i))}</small>` : ""}</div><div class="val">${fmt(i.v)}</div>
    <div class="track">${(i.parts || [{v: i.v, c: i.other ? "--rule-2" : color(i)}]).map(p => `<span style="width:${p.v / max * 100}%;background:var(${p.c})" title="${esc(p.n || "")}"></span>`).join("")}</div></div>`).join("")}</div>`
    : `<div class="empty">${esc(t("nothing_match"))}</div>`;
}
function columns(id, items, {h = 170, cap, label, title, legend}) {
  const host = $(id), W = host.clientWidth || 500, PL = 40, PB = 22, PT = 10;
  const max = Math.max(cap || 0, ...items.map(i => i.total), 1) * 1.08;
  const n = items.length, slot = (W - PL) / Math.max(n, 1), bw = Math.min(24, slot * .62);
  const y = val => PT + (h - PT - PB) * (1 - val / max);
  const svg = el("svg", {class: "chart", viewBox: `0 0 ${W} ${h}`, height: h});
  const step = niceStep(max);
  for (let tk = 0; tk <= max; tk += step) { el("line", {x1: PL, x2: W, y1: y(tk), y2: y(tk), class: "gl"}, svg); txt(svg, PL - 6, y(tk) + 3.5, usd0(tk), {"text-anchor": "end", class: "mono"}); }
  if (cap) { el("line", {x1: PL, x2: W, y1: y(cap), y2: y(cap), stroke: cssv("--pen-red"), "stroke-width": 1.5}, svg); txt(svg, W, y(cap) - 5, `${t("cap")} ${usd0(cap)}`, {"text-anchor": "end", fill: cssv("--pen-red")}); }
  const tip = host.querySelector(".tip") || Object.assign(document.createElement("div"), {className: "tip"});
  items.forEach((it, i) => {
    const cx = PL + slot * i + slot / 2;
    let acc = 0;
    const segs = it.parts.filter(p => p.v > 0);
    segs.forEach((p, k) => {
      const y1 = y(acc + p.v), y0 = y(acc); acc += p.v;
      const top = k === segs.length - 1, hgt = Math.max(0, y0 - y1 - (k ? 2 : 0));
      el("path", {d: top ? roundTop(cx - bw / 2, y1, bw, hgt, Math.min(4, hgt)) : `M${cx - bw / 2} ${y1}h${bw}v${hgt}h${-bw}Z`, fill: `var(${p.c})`}, svg);
    });
    if (label(it, i)) txt(svg, cx, h - 6, label(it, i), {"text-anchor": "middle", class: "mono", "font-size": 10.5});
    const hitR = el("rect", {x: cx - slot / 2, y: 0, width: slot, height: h - PB, fill: "transparent"}, svg);
    hitR.addEventListener("mousemove", e => { const r = host.getBoundingClientRect(); tip.innerHTML = title(it); tip.style.left = Math.min(e.clientX - r.left + 12, r.width - 200) + "px"; tip.style.top = "0px"; tip.classList.add("on"); });
    hitR.addEventListener("mouseleave", () => tip.classList.remove("on"));
  });
  host.innerHTML = ""; host.appendChild(svg); host.appendChild(tip);
  if (legend) host.insertAdjacentHTML("beforeend", legend);
}
const roundTop = (x0, y0, w, h, r) => `M${x0} ${y0 + h}V${y0 + r}q0 ${-r} ${r} ${-r}h${w - 2 * r}q${r} 0 ${r} ${r}V${y0 + h}Z`;
function niceStep(max) { const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n < 1.5 ? 1 : n < 3.5 ? 2.5 : n < 7.5 ? 5 : 10) * p; }
const tipRows = (head, rows) => `<div style="margin-bottom:4px"><b>${esc(head)}</b></div>` + rows.map(([a, b]) => `<div class="row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join("");
const legendHtml = items => `<div class="legend">${items.map(i => `<span><i class="sw" style="background:var(${i.c})"></i>${esc(i.n)}${i.v != null ? ` <b>${esc(i.v)}</b>` : ""}</span>`).join("")}</div>`;

// ---------- spending ----------
function renderSpend(v) {
  const ss = sessions(v), f = F.span, total = ss.reduce((a, r) => a + r[f], 0);
  const kinds = KINDS.filter(k => F.kinds.includes(k)).map(k => ({n: t("k_" + k), c: KVAR(k), v: ss.filter(r => r.kind === k).reduce((a, r) => a + r[f], 0)}));
  $("who_aside").textContent = t("total_f", {v: usd(total)}) + " · " + t("sessions_n", {n: ss.length});
  const top = ss.slice().sort((a, b) => b[f] - a[f]);
  $("who").innerHTML = `<div class="stackbar">${kinds.filter(k => k.v > 0).map(k => `<span style="flex:${k.v};background:var(${k.c})" title="${esc(k.n)} ${usd(k.v)}"></span>`).join("")}</div>
    ${legendHtml(kinds.filter(k => k.v > 0).map(k => ({...k, v: usd(k.v)})))}<div style="margin-top:18px" id="who_top"></div>`;
  ranks("who_top", top.map(r => ({n: nameOf(r), v: r[f], kind: r.kind, sub: r.project})), {color: i => KVAR(i.kind), limit: 7});

  // heatmap: 7 local days × 24 hours
  const host = $("heat"), W = host.clientWidth || 520, PL = 46, PT = 16, rows = 7, cw = (W - PL) / 24, ch = 22;
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 6 + i); return d; });
  const cell = {};
  for (const [h, kinds_] of Object.entries(v.hourly || {})) {
    const d = new Date(h + ":00:00Z"), key = d.toDateString() + "|" + d.getHours();
    cell[key] = (cell[key] || 0) + Object.entries(kinds_).filter(([k]) => F.kinds.includes(k)).reduce((a, [, x]) => a + x, 0);
  }
  const vals = Object.values(cell), hmax = Math.max(1e-9, ...vals);
  const svg = el("svg", {class: "chart", viewBox: `0 0 ${W} ${PT + rows * ch + 22}`, height: PT + rows * ch + 22});
  const tip = Object.assign(document.createElement("div"), {className: "tip"});
  for (let hh = 0; hh < 24; hh += 3) txt(svg, PL + hh * cw + cw / 2, 10, String(hh).padStart(2, "0"), {"text-anchor": "middle", class: "mono", "font-size": 10});
  days.forEach((d, r) => {
    txt(svg, PL - 8, PT + r * ch + ch / 2 + 4, d.toLocaleDateString(loc(), {weekday: "short"}), {"text-anchor": "end"});
    for (let hh = 0; hh < 24; hh++) {

function chainEditor(fb) {
  const rtName = id => fb.runtimes.find(r => r.id === id)?.name || id.slice(0, 8);
  return `<div class="fb-edit" id="fb_editor">${fbEdit.chain.map((e, k) => `<div class="fb-edit-row"><span class="mono" style="width:22px">#${k + 1}</span><span style="min-width:180px">${esc(rtName(e.runtime_id))}</span><span class="mono">${esc(e.model)}</span>
      <button class="icon-btn" data-up="${k}" ${k ? "" : "disabled"} aria-label="up"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 2 L9 7 H1 Z" fill="currentColor"/></svg></button>
      <button class="icon-btn" data-rm="${k}" aria-label="remove"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 2 L8 8 M8 2 L2 8" stroke="currentColor" stroke-width="1.6"/></svg></button></div>`).join("")}
    <div class="fb-edit-row"><select class="sel" id="fb_rt"><option value="">${esc(t("fb_runtime"))}</option>${fb.runtimes.map(r => `<option value="${esc(r.id)}">${esc(r.name)}${r.online ? "" : " · " + esc(t("fb_offline"))}</option>`).join("")}</select>
      <input id="fb_model" list="fb_models" placeholder="${esc(t("fb_model"))}"><datalist id="fb_models"></datalist><button class="btn" id="fb_addbtn">${esc(t("fb_add_entry"))}</button></div>
    <div class="fb-edit-row" style="margin-top:4px"><button class="btn" id="fb_cancel">${esc(t("cancel"))}</button><button class="btn primary" id="fb_save">${esc(t("fb_save"))}</button></div></div>`;
}
function wireEditor(fb, v) {
  const box = $("fb_editor");
  if (!box || !fbEdit) return;
  box.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const k = +b.dataset.up; [fbEdit.chain[k - 1], fbEdit.chain[k]] = [fbEdit.chain[k], fbEdit.chain[k - 1]]; renderFallbacks(v); });
  box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { fbEdit.chain.splice(+b.dataset.rm, 1); renderFallbacks(v); });
  $("fb_rt").onchange = e => {
    const r = fb.runtimes.find(x => x.id === e.target.value), c = (v.options.catalog || {})[r?.provider];
    const fromCat = c ? Object.entries(c.models).flatMap(([m, l]) => c.in_name && l.length ? l.map(x => `${m}-${x}`) : [m]) : [];
    $("fb_models").innerHTML = [...new Set([...(r?.models || []), ...fromCat])].map(m => `<option value="${esc(m)}">`).join("");
  };
  $("fb_addbtn").onclick = () => { const rid = $("fb_rt").value, m = $("fb_model").value.trim(); if (rid && m) { fbEdit.chain.push({runtime_id: rid, model: m, thinking: ""}); renderFallbacks(v); } };
  $("fb_cancel").onclick = () => { fbEdit = null; editing = false; renderFallbacks(v); };
  $("fb_save").onclick = () => { const e = fbEdit; confirmBox(t("cf_fb_chain_t", {a: e.name}), `<span class="sub">${esc(t("cf_fb_chain_sub"))}</span>`, async () => { fbEdit = null; editing = false; await act("/api/fallback/chain", {agent_id: e.id, chain: e.chain}); }); };
}

// ---------- chrome ----------
function renderChrome(v) {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  $("rec_note").textContent = t("rec_note");
  if (!v) return;
  $("updated").textContent = t("updated", {t: hm(v.now)});
  const N = ["blocks", "daily", "scan", "quotas", "antigravity", "multica", "issues", "agents", "fallback", "stop_files"].filter(k => k in v.sources || ["blocks", "daily", "scan", "quotas"].includes(k));
  const bad = N.filter(k => v.sources[k] && !v.sources[k].ok), wait = N.filter(k => !v.sources[k]);
  const h = $("health");
  h.className = "health" + (bad.length ? " bad" : "");
  h.title = N.map(k => `${t("src_" + k)}: ${v.sources[k] ? (v.sources[k].ok ? hm(v.sources[k].at) : v.sources[k].error) : "…"}`).join("\n");
  h.innerHTML = `<svg width="10" height="10" aria-hidden="true">${bad.length ? `<path d="M5 1 L9.5 9 H0.5 Z" fill="var(--pen-red)"/>` : `<rect x="1.5" y="1.5" width="7" height="7" rx="1.5" fill="${wait.length ? "var(--ink-3)" : "var(--green)"}"/>`}</svg><span class="htext">${esc(bad.length ? t("not_readable", {x: bad.map(k => t("src_" + k)).join(", ")}) : wait.length ? t("collecting", {x: wait.map(k => t("src_" + k)).join(", ")}) : t("all_fresh"))}</span>`;
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { LANG = b.dataset.lang; try { localStorage.setItem("quotaboard-lang", LANG); } catch (e) {} renderAll(); });

function safe(f) { try { f(D); } catch (e) { console.error(f.name, e); } }
function draw() { if (!D) return; renderControls(D); for (const f of [renderSpend, renderSessions, renderRuns]) safe(f); if (!editing) { safe(renderAgents); safe(renderFallbacks); } }
function renderAll() { renderChrome(D); if (!D) return; for (const f of [drawRecorder, renderNotes, renderFacts]) safe(f); draw(); }
async function load() {
  try { D = await (await fetch("/api/data", {cache: "no-store"})).json(); }
  catch (e) { $("updated").textContent = t("unreachable"); return; }
  renderAll();
}
renderChrome(null);
load();
setInterval(() => { if (!$("confirm").open && !$("app_entry").classList.contains("on") && document.activeElement?.tagName !== "SELECT") load(); }, 30000);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (D) { safe(drawRecorder); draw(); } }, 150); });
</script>
</body>
</html>
